<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<title>FIFA World Cup 2026 - Estadio Virtual</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
:root {
  --gold: #f5c518;
  --gold2: #c9900a;
  --red: #c0392b;
  --green: #27ae60;
  --bg: #121212;      /* Gris Carbón */
  --mid: #1a1a1a;
  --card: #1e1e1e;
  --border: #333333;
  --text: #e8eaf0;
  --muted: #888888;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Exo 2', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* ── ILUMINACIÓN DINÁMICA DE ESTADIO (FONDO) ── */
body::before {
  content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle at center, rgba(245,197,24,0.03) 0%, transparent 50%);
  z-index: -1; animation: stadiumMove 20s infinite linear;
}
@keyframes stadiumMove {
  0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); }
}

/* ── ANIMACIONES GLOBALES ── */
.fade-in { animation: fadeIn 0.8s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.stagger-card { opacity: 0; transform: translateY(30px); animation: staggerIn 0.5s ease forwards; }
@keyframes staggerIn { to { opacity: 1; transform: translateY(0); } }

/* ── LOGIN ── */
.login-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.login-card { 
  width: 100%; max-width: 360px; background: rgba(30, 30, 30, 0.9); border: 2px solid var(--border); 
  border-radius: 28px; padding: 40px; text-align: center; backdrop-filter: blur(15px);
  box-shadow: 0 25px 50px rgba(0,0,0,0.8); animation: cardFloat 4s infinite ease-in-out;
}
@keyframes cardFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

.trophy-icon { font-size: 5rem; filter: drop-shadow(0 0 20px var(--gold)); margin-bottom: 20px; animation: trophyPulse 2s infinite; }
@keyframes trophyPulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px var(--gold2)); } 50% { transform: scale(1.1); filter: drop-shadow(0 0 30px var(--gold)); } }

.login-input { 
  width: 100%; height: 60px; background: var(--mid); border: 2px solid var(--border); border-radius: 15px; 
  color: #fff; font-size: 1.4rem; text-align: center; letter-spacing: 5px; margin-bottom: 20px; outline: none;
  transition: all 0.3s;
}
.login-input:focus { border-color: var(--gold); box-shadow: 0 0 15px rgba(245,197,24,0.2); }

.login-btn { 
  width: 100%; height: 60px; background: linear-gradient(135deg, var(--gold), var(--gold2)); border: none; 
  border-radius: 15px; color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; cursor: pointer;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: 0.3s;
}
.login-btn:hover { transform: scale(1.02); filter: brightness(1.1); }

/* ── BANNER ESTILO TRANSMISIÓN ── */
.fifa-banner {
  background: linear-gradient(90deg, #000, #222, #000);
  border: 1px solid var(--border); border-radius: 20px; padding: 40px 20px;
  text-align: center; margin-bottom: 30px; position: relative; overflow: hidden;
  box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}
.fifa-banner::before {
  content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  transform: skewX(-25deg); animation: lightSweep 4s infinite;
}
@keyframes lightSweep { 0% { left: -100%; } 30% { left: 150%; } 100% { left: 150%; } }

.fifa-title { 
  font-family: 'Bebas Neue', sans-serif; font-size: 4rem; color: #fff; line-height: 0.9;
  background: linear-gradient(to bottom, #fff 40%, var(--gold) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
}

/* ── TARJETAS DINÁMICAS ── */
.matches { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media(min-width: 768px) { .matches { grid-template-columns: 1fr 1fr; } }

.match { 
  background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; 
  position: relative; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.match:hover { transform: scale(1.02); border-color: #555; background: #252525; }

.match.filled { border-color: var(--gold2); box-shadow: 0 10px 25px rgba(245,197,24,0.1); }
.match.filled::before { 
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; 
  background: var(--gold); animation: lineGlow 1.5s infinite alternate;
}
@keyframes lineGlow { from { opacity: 0.5; box-shadow: 0 0 5px var(--gold); } to { opacity: 1; box-shadow: 0 0 20px var(--gold); } }

.match-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.team { display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 700; font-size: 0.9rem; }
.flag { width: 42px; height: 28px; border-radius: 5px; object-fit: cover; box-shadow: 0 5px 10px rgba(0,0,0,0.5); border: 1px solid #333; }

/* FIX EXPORTACIÓN (NÚMEROS) */
.score { 
  width: 55px; height: 55px; line-height: 55px; background: #121212; border: 2px solid #444; 
  border-radius: 12px; color: var(--gold); font-family: 'Bebas Neue', sans-serif; 
  font-size: 2rem; text-align: center; outline: none; transition: 0.3s;
}
.score:focus { border-color: var(--gold); background: #000; }

/* ── OVERLAY GOL & FLASH ── */
#flash { position: fixed; inset: 0; background: #fff; z-index: 10000; opacity: 0; pointer-events: none; }
#goalOverlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999;
  display: none; align-items: center; justify-content: center; flex-direction: column;
}
.goal-text { 
  font-family: 'Bebas Neue', sans-serif; font-size: 15vw; color: var(--gold); 
  text-shadow: 0 0 70px var(--gold); animation: goalPop 0.3s infinite alternate;
}
@keyframes goalPop { from { transform: scale(1); } to { transform: scale(1.15); } }

/* ── UI INTERACTIVA ── */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
.action-btn { 
  height: 55px; border: none; border-radius: 15px; font-family: 'Bebas Neue', sans-serif; 
  font-size: 1.1rem; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: 0.3s; position: relative; overflow: hidden;
}
.action-btn:active { transform: scale(0.95); }

#toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; padding: 12px 30px; border-radius: 100px; font-weight: 700; opacity: 0; transition: 0.4s; z-index: 3000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
</style>
</head>
<body>

<div id="flash"></div>

<audio id="fifaSound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" type="audio/mpeg">
</audio>

<div id="goalOverlay">
    <div class="goal-text">¡GOOOOOOOOL!</div>
    <div style="width: 80%; height: 4px; background: var(--gold); margin: 20px 0; border-radius: 2px;"></div>
    <p style="font-family: 'Bebas Neue'; color: #fff; font-size: 1.8rem; letter-spacing: 5px;">CAPTURANDO MOMENTO...</p>
</div>

<div class="login-screen" id="loginScreen">
  <div class="login-card fade-in">
    <div class="trophy-icon">🏆</div>
    <h1 style="font-family: 'Bebas Neue'; color: var(--gold); font-size: 2.8rem; letter-spacing: 2px;">WORLD CUP 2026</h1>
    <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 30px;">PREDICTOR OFICIAL</p>
    
    <input type="text" id="codeInput" class="login-input" maxlength="6" placeholder="CÓDIGO">
    <div id="loginPreview" style="color: var(--gold); font-weight: 700; margin-bottom: 20px; height: 20px; font-size: 1.1rem;"></div>
    
    <button class="login-btn" onclick="doLogin()">SALTAR AL CAMPO</button>
    <div id="loginErr" style="color: var(--red); margin-top: 15px; font-size: 0.85rem;"></div>
  </div>
</div>

<div class="app" id="app" style="display:none;">
  <div class="main" style="max-width: 1200px; margin: auto; padding: 20px;">
    
    <div class="fifa-banner fade-in">
      <div class="fifa-title">MUNDIAL 2026</div>
      <p style="color: var(--gold); font-family: 'Bebas Neue'; font-size: 1.5rem; letter-spacing: 5px; margin-top: 5px;">JORNADA 1 • EN VIVO</p>
    </div>

    <div class="actions">
      <button class="action-btn" style="background:var(--gold); color:#000" onclick="savePicks()">💾 GUARDAR</button>
      <button class="action-btn" style="background:var(--green)" onclick="handleExport()">📸 EXPORTAR</button>
      <button class="action-btn" style="background:var(--red)" onclick="handleLock()">🔒 BLOQUEAR</button>
      <button class="action-btn" style="background:#4b5563" onclick="handleUnlock()">🔓 ADMIN</button>
    </div>

    <div style="background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 20px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
      <div id="statusText" style="font-weight: 800; letter-spacing: 1px;">ESTADO: ABIERTO 🟢</div>
      <div id="displayUser" style="font-weight: 700; color: var(--gold); text-transform: uppercase; background: rgba(245,197,24,0.1); padding: 5px 15px; border-radius: 50px;"></div>
    </div>

    <div id="captureArea" style="padding: 15px; background: var(--bg);">
       <div id="captureHeader" style="display:none; margin-bottom: 30px; border-bottom: 2px solid var(--border); padding-bottom: 20px;">
           <div style="display: flex; justify-content: space-between; align-items: flex-end;">
             <div>
               <div style="font-family:'Bebas Neue'; color: var(--gold); font-size: 3rem; line-height: 1;">FIFA WORLD CUP 2026</div>
               <div id="capStatus" style="font-family: 'Bebas Neue'; color:#fff; font-size: 1.5rem; margin-top: 5px;">-</div>
             </div>
             <div style="text-align: right;">
               <div style="color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Participante</div>
               <div id="capUser" style="color:#fff; font-size: 1.8rem; font-family: 'Bebas Neue';"></div>
             </div>
           </div>
       </div>
       <div class="matches" id="matchesContainer"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const ADMIN_PASS = "AP420";
const USER_CODES = { 
    "JDQM26": "Juan de Dios", 
    "AEQM26": "Andrés Esparza",
    "ADMIN0": "Administrador" 
};

const FLAGS = {
  "México": "mx", "Sudáfrica": "za", "Corea del Sur": "kr", "Rep. Checa": "cz",
  "Canadá": "ca", "Bosnia y Herz.": "ba", "Estados Unidos": "us", "Paraguay": "py",
  "Qatar": "qa", "Suiza": "ch", "Brasil": "br", "Marruecos": "ma",
  "Haití": "ht", "Escocia": "gb-sct", "Australia": "au", "Turquía": "tr",
  "Alemania": "de", "Curazao": "cw", "Países Bajos": "nl", "Japón": "jp",
  "Costa de Marfil": "ci", "Ecuador": "ec", "Suecia": "se", "Túnez": "tn",
  "España": "es", "Cabo Verde": "cv", "Bélgica": "be", "Egipto": "eg",
  "Arabia Saudita": "sa", "Uruguay": "uy", "Irán": "ir", "Nueva Zelanda": "nz",
  "Francia": "fr", "Senegal": "sn", "Argentina": "ar", "Argelia": "dz",
  "Irak": "iq", "Noruega": "no", "Austria": "at", "Jordania": "jo",
  "Portugal": "pt", "RD Congo": "cd", "Ghana": "gh", "Panamá": "pa",
  "Inglaterra": "gb-eng", "Croacia": "hr", "Uzbekistán": "uz", "Colombia": "co"
};

const MATCHES = [
  {h:"México",a:"Sudáfrica",d:"11 Jun · 13:00",s:"Estadio Azteca"},
  {h:"Corea del Sur",a:"Rep. Checa",d:"11 Jun · 20:00",s:"Estadio Akron"},
  {h:"Canadá",a:"Bosnia y Herz.",d:"12 Jun · 13:00",s:"Toronto Stadium"},
  {h:"Estados Unidos",a:"Paraguay",d:"12 Jun · 19:00",s:"SoFi Stadium"},
  {h:"Qatar",a:"Suiza",d:"13 Jun · 13:00",s:"Bay Area Stadium"},
  {h:"Brasil",a:"Marruecos",d:"13 Jun · 16:00",s:"MetLife Stadium"},
  {h:"Haití",a:"Escocia",d:"13 Jun · 19:00",s:"Gillette Stadium"},
  {h:"Australia",a:"Turquía",d:"13 Jun · 22:00",s:"BC Place"},
  {h:"Alemania",a:"Curazao",d:"14 Jun · 11:00",s:"NRG Stadium"},
  {h:"Países Bajos",a:"Japón",d:"14 Jun · 14:00",s:"AT&T Stadium"},
  {h:"Costa de Marfil",a:"Ecuador",d:"14 Jun · 17:00",s:"Lincoln Financial"},
  {h:"Suecia",a:"Túnez",d:"14 Jun · 20:00",s:"Estadio BBVA"},
  {h:"España",a:"Cabo Verde",d:"15 Jun · 10:00",s:"Mercedes-Benz Stadium"},
  {h:"Bélgica",a:"Egipto",d:"15 Jun · 13:00",s:"Lumen Field"},
  {h:"Arabia Saudita",a:"Uruguay",d:"15 Jun · 16:00",s:"Hard Rock Stadium"},
  {h:"Irán",a:"Nueva Zelanda",d:"15 Jun · 19:00",s:"SoFi Stadium"},
  {h:"Francia",a:"Senegal",d:"16 Jun · 13:00",s:"MetLife Stadium"},
  {h:"Argentina",a:"Argelia",d:"16 Jun · 16:00",s:"Arrowhead Stadium"},
  {h:"Irak",a:"Noruega",d:"16 Jun · 19:00",s:"Gillette Stadium"},
  {h:"Austria",a:"Jordania",d:"16 Jun · 19:00",s:"Bay Area Stadium"},
  {h:"Portugal",a:"RD Congo",d:"17 Jun · 11:00",s:"NRG Stadium"},
  {h:"Ghana",a:"Panamá",d:"17 Jun · 13:00",s:"Toronto Stadium"},
  {h:"Inglaterra",a:"Croacia",d:"17 Jun · 14:00",s:"AT&T Stadium"},
  {h:"Uzbekistán",a:"Colombia",d:"17 Jun · 19:00",s:"Estadio Azteca"}
];

let currentUser = "", currentCode = "", locked = false, picks = {};

document.getElementById('codeInput').addEventListener('input', function() {
    let n = USER_CODES[this.value.toUpperCase()];
    document.getElementById('loginPreview').textContent = n ? "HOLA, " + n + "!" : "";
});

function doLogin(){
  let c = document.getElementById("codeInput").value.toUpperCase();
  if(USER_CODES[c]){
    document.getElementById('fifaSound').play().catch(e => {});
    currentUser = USER_CODES[c]; currentCode = c;
    loadData(); 
    // Animación de salida del login
    document.querySelector('.login-card').style.transform = "scale(0.8)";
    document.querySelector('.login-card').style.opacity = "0";
    setTimeout(() => { showApp(); }, 300);
  } else { document.getElementById("loginErr").textContent = "CÓDIGO NO VÁLIDO"; }
}

function loadData(){
  picks = JSON.parse(localStorage.getItem("wc26_picks_" + currentCode) || "{}");
  locked = localStorage.getItem("wc26_lock_" + currentCode) === "1";
}

function showApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("displayUser").textContent = currentUser;
  renderMatches();
  updateStatusUI();
}

function renderMatches(){
  const mc = document.getElementById("matchesContainer");
  mc.innerHTML = "";
  
  MATCHES.forEach((m, idx) => {
    const hV = picks[`j1_${idx}_h`] || ""; const aV = picks[`j1_${idx}_a`] || "";
    const card = document.createElement('div');
    card.className = `match stagger-card ${hV !== '' && aV !== '' ? 'filled' : ''}`;
    card.style.animationDelay = (idx * 0.05) + "s";
    card.innerHTML = `
        <div class="match-top">
          <div class="team">
            <img class="flag" src="https://flagcdn.com/w80/${FLAGS[m.h] || "un"}.png">
            <span>${m.h}</span>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <input class="score" type="number" value="${hV}" ${locked?'disabled':''} oninput="updatePick(${idx},'h',this)">
            <span style="color:var(--gold); font-family:'Bebas Neue'; font-size: 1.5rem;">:</span>
            <input class="score" type="number" value="${aV}" ${locked?'disabled':''} oninput="updatePick(${idx},'a',this)">
          </div>
          <div class="team">
            <img class="flag" src="https://flagcdn.com/w80/${FLAGS[m.a] || "un"}.png">
            <span>${m.a}</span>
          </div>
        </div>
        <div style="margin-top:12px; font-size:0.7rem; color:var(--muted); text-align:center; font-weight:600;">
          ${m.d} | ${m.s}
        </div>
    `;
    mc.appendChild(card);
  });
}

function updatePick(idx, side, el){
  picks[`j1_${idx}_${side}`] = el.value.slice(0,2);
  const isComplete = (picks[`j1_${idx}_h`] && picks[`j1_${idx}_a`]);
  el.closest(".match").classList.toggle("filled", isComplete);
}

function updateStatusUI(){
  document.getElementById("statusText").innerHTML = locked ? "ESTADO: CERRADO 🔒" : "ESTADO: ABIERTO 🟢";
  document.getElementById("statusText").style.color = locked ? "var(--red)" : "var(--green)";
}

function savePicks(){
  if(locked) return showToast("🔒 REGISTRO CERRADO");
  localStorage.setItem("wc26_picks_" + currentCode, JSON.stringify(picks));
  showToast("💾 PRONÓSTICOS GUARDADOS");
}

function handleLock(){
  if(locked) return;
  if(confirm("¿BLOQUEAR PRONÓSTICOS DEFINITIVAMENTE?")) {
    locked = true; localStorage.setItem("wc26_lock_" + currentCode, "1");
    savePicks(); renderMatches(); updateStatusUI();
  }
}

function handleUnlock(){
  let p = prompt("CLAVE ADMIN:");
  if(p === ADMIN_PASS){
    locked = false; localStorage.setItem("wc26_lock_" + currentCode, "0");
    renderMatches(); updateStatusUI();
    showToast("🔓 ACCESO HABILITADO");
  }
}

function handleExport(){
  if(!locked){
    let p = prompt("INGRESA CLAVE ADMIN PARA EXPORTAR SIN BLOQUEAR:");
    if(p === ADMIN_PASS) doExport();
  } else {
    doExport();
  }
}

function doExport(){
  // EFECTO FLASH
  document.getElementById('flash').style.opacity = "1";
  setTimeout(() => { document.getElementById('flash').style.opacity = "0"; }, 150);
  
  setTimeout(() => {
    const overlay = document.getElementById("goalOverlay");
    overlay.style.display = "flex";
    
    setTimeout(() => {
        const area = document.getElementById("captureArea");
        const header = document.getElementById("captureHeader");
        header.style.display = "block";
        document.getElementById("capStatus").textContent = locked ? "PRONÓSTICO CERRADO" : "PRONÓSTICO ABIERTO";
        document.getElementById("capUser").textContent = currentUser;

        // Convertir inputs a divs para evitar errores de renderizado
        const inputs = area.querySelectorAll("input");
        const backups = [];
        inputs.forEach(inp => {
          const rep = document.createElement("div");
          rep.className = inp.className;
          rep.style.height = "55px"; rep.style.lineHeight = "55px";
          rep.style.display = "inline-block"; rep.style.textAlign = "center";
          rep.textContent = inp.value || "-";
          backups.push({orig: inp, rep: rep});
          inp.style.display = "none";
          inp.parentNode.insertBefore(rep, inp);
        });

        html2canvas(area, { scale: 2, backgroundColor: "#121212", useCORS: true }).then(canvas => {
            backups.forEach(b => { b.rep.remove(); b.orig.style.display = "inline-block"; });
            header.style.display = "none";
            overlay.style.display = "none";
            const link = document.createElement("a");
            link.download = `WC26_${currentUser}.jpg`;
            link.href = canvas.toDataURL("image/jpeg", 0.9);
            link.click();
        });
    }, 1200);
  }, 300);
}

function showToast(m){
  const t = document.getElementById("toast"); t.textContent = m;
  t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 2500);
}
</script>
</body>
</html>
