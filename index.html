<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mundial 2026 - Quiniela Jornada 1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
:root {
  --gold: #f5c518;
  --gold2: #c9900a;
  --red: #c0392b;
  --green: #27ae60;
  --bg: #0a0e1a;
  --mid: #101828;
  --card: #141e32;
  --border: #1e2d4a;
  --text: #e8eaf0;
  --muted: #6a7a9a;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Exo 2', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); min-height: 100vh; }

/* LOGIN */
.login-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.login-card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 32px; text-align: center; }
.login-input { width: 100%; height: 55px; background: var(--mid); border: 2px solid var(--border); border-radius: 12px; color: #fff; font-size: 1.2rem; text-align: center; letter-spacing: 4px; margin: 20px 0; outline: none; }
.login-btn { width: 100%; height: 55px; background: linear-gradient(135deg, var(--gold), var(--gold2)); border: none; border-radius: 12px; font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; cursor: pointer; }

/* APP STRUCTURE */
.topbar { position: sticky; top: 0; z-index: 100; background: rgba(10, 14, 26, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 16px; }
.topbar-inner { max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
.main { max-width: 1200px; margin: auto; padding: 16px; padding-bottom: 100px; }

/* ACTIONS */
.actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
.action-btn { height: 48px; border: none; border-radius: 12px; font-family: 'Bebas Neue', sans-serif; font-size: 1rem; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; }
.save-btn { background: var(--gold); color: #000; }
.export-btn { background: var(--green); }
.lock-btn { background: var(--red); }
.unlock-btn { background: #4b5563; }

/* MATCHES */
.matches { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media(min-width: 768px) { .matches { grid-template-columns: 1fr 1fr; } }
.match { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; position: relative; }
.match::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--gold); opacity: 0.2; }
.match.filled::before { opacity: 1; box-shadow: 0 0 15px var(--gold); }
.match-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.team { font-weight: 700; font-size: 0.9rem; }
.score { width: 50px; height: 50px; background: var(--mid); border: 2px solid var(--border); border-radius: 12px; color: var(--gold); font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; text-align: center; outline: none; }
.score:disabled { opacity: 0.4; }

/* CAPTURE HEADER (Visible solo en imagen) */
.capture-header { display: none; background: rgba(20, 30, 50, 0.8); border-radius: 15px; padding: 20px; margin-bottom: 25px; border: 1px solid var(--border); }
.vip-card { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #000; padding: 12px 25px; border-radius: 12px; box-shadow: 0 8px 25px rgba(245, 197, 24, 0.4); text-align: center; }

/* MODAL & TOAST */
.modal-overlay { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 30px; max-width: 340px; width: 100%; text-align: center; }
#toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; padding: 12px 24px; border-radius: 100px; font-weight: 700; opacity: 0; transition: 0.4s; z-index: 3000; }
#toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1 style="font-family: 'Bebas Neue'; color: var(--gold); font-size: 2.2rem;">WORLD CUP 2026</h1>
    <input type="text" id="codeInput" class="login-input" maxlength="6" placeholder="CÓDIGO">
    <div id="loginPreview" style="height: 20px; color: var(--gold); font-weight: 700;"></div>
    <button class="login-btn" onclick="doLogin()">INGRESAR</button>
    <div id="loginErr" style="color: var(--red); margin-top: 10px;"></div>
  </div>
</div>

<div class="app" id="app" style="display:none;">
  <div class="topbar">
    <div class="topbar-inner">
      <h2 style="font-family: 'Bebas Neue'; color: var(--gold);">⚽ JORNADA 1</h2>
      <div id="displayUser" style="font-weight: 700; font-size: 0.9rem;"></div>
    </div>
  </div>

  <div class="main">
    <div class="actions">
      <button class="action-btn save-btn" onclick="savePicks()">💾 GUARDAR</button>
      <button class="action-btn export-btn" onclick="handleExport()">📸 EXPORTAR</button>
      <button class="action-btn lock-btn" onclick="handleLock()">🔒 BLOQUEAR</button>
      <button class="action-btn unlock-btn" onclick="handleUnlock()">🔓 ADMIN</button>
    </div>

    <div style="background: var(--card); border: 1px solid var(--border); padding: 12px 16px; border-radius: 14px; margin-bottom: 20px; display: flex; justify-content: space-between;">
      <div>Estado: <strong id="statusText">ABIERTO</strong></div>
      <div id="statusProgress" style="color: var(--muted); font-size: 0.75rem;">0 / 24 completados</div>
    </div>

    <div id="captureArea" style="padding: 10px; background: var(--bg);">
      <div id="captureHeader" class="capture-header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-family: 'Bebas Neue'; font-size: 2.2rem; color: #fff;">FIFA WORLD CUP 2026</div>
            <div style="display: flex; gap: 10px; align-items: center; margin-top: 5px;">
              <div style="font-family: 'Bebas Neue'; font-size: 1.3rem; color: var(--gold);">PRONÓSTICOS JORNADA 1</div>
              <div id="capStatus" style="font-weight: 900; font-size: 0.7rem; padding: 3px 10px; border-radius: 4px;">ABIERTO</div>
            </div>
          </div>
          <div class="vip-card">
            <div style="font-size: 0.7rem; text-transform: uppercase; margin-bottom: 2px; opacity: 0.8;">Participante Oficial</div>
            <div id="capUser" style="font-family: 'Bebas Neue'; font-size: 1.8rem; letter-spacing: 1px;">-</div>
          </div>
        </div>
      </div>
      <div class="matches" id="matchesContainer"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="pwModal">
  <div class="modal">
    <h3 id="pwTitle" style="font-family: 'Bebas Neue'; color: var(--gold); font-size: 1.6rem;">ADMIN ACCESO</h3>
    <p id="pwDesc" style="font-size: 0.8rem; color: var(--muted); margin: 15px 0;">Se requiere clave para continuar</p>
    <input type="password" id="pwInput" class="login-input" placeholder="••••">
    <div style="display: flex; gap: 10px;">
      <button class="action-btn unlock-btn" style="flex:1" onclick="closePwModal()">CANCELAR</button>
      <button class="action-btn save-btn" style="flex:1" onclick="confirmPwModal()">OK</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const ADMIN_PASS = "AP420";
const USER_CODES = { "JDQM26": "Juan de Dios", "ADMIN0": "Administrador" };

// INFORMACIÓN COMPLETA DE LA JORNADA 1 (24 PARTIDOS)
const MATCHES = [
  {h:"México",a:"Sudáfrica",d:"11 Jun · 13:00",s:"Estadio Azteca"},
  {h:"Corea del Sur",a:"Rep. Checa",d:"11 Jun · 20:00",s:"Estadio Akron"},
  {h:"Canadá",a:"Bosnia y Herz.",d:"12 Jun · 13:00",s:"Toronto Stadium"},
  {h:"Estados Unidos",a:"Paraguay",d:"12 Jun · 19:00",s:"SoFi Stadium"},
  {h:"Qatar",a:"Suiza",d:"13 Jun · 13:00",s:"Bay Area Stadium"},
  {h:"Brasil",a:"Marruecos",d:"13 Jun · 16:00",s:"MetLife Stadium"},
  {h:"Haití",a:"Escocia",d:"13 Jun · 19:00",s:"Gillette Stadium"},
  {h:"Australia",a:"Turquía",d:"13 Jun · 22:00",s:"BC Place"},
  {h:"Alemania",a:"Curazao",d:"14 Jun · 11:00",s:"NRG Stadium"},
  {h:"Países Bajos",a:"Japón",d:"14 Jun · 14:00",s:"AT&T Stadium"},
  {h:"Costa de Marfil",a:"Ecuador",d:"14 Jun · 17:00",s:"Lincoln Financial"},
  {h:"Suecia",a:"Túnez",d:"14 Jun · 20:00",s:"Estadio BBVA"},
  {h:"España",a:"Cabo Verde",d:"15 Jun · 10:00",s:"Mercedes-Benz Stadium"},
  {h:"Bélgica",a:"Egipto",d:"15 Jun · 13:00",s:"Lumen Field"},
  {h:"Arabia Saudita",a:"Uruguay",d:"15 Jun · 16:00",s:"Hard Rock Stadium"},
  {h:"Irán",a:"Nueva Zelanda",d:"15 Jun · 19:00",s:"SoFi Stadium"},
  {h:"Francia",a:"Senegal",d:"16 Jun · 13:00",s:"MetLife Stadium"},
  {h:"Argentina",a:"Argelia",d:"16 Jun · 16:00",s:"Arrowhead Stadium"},
  {h:"Irak",a:"Noruega",d:"16 Jun · 19:00",s:"Gillette Stadium"},
  {h:"Austria",a:"Jordania",d:"16 Jun · 19:00",s:"Bay Area Stadium"},
  {h:"Portugal",a:"RD Congo",d:"17 Jun · 11:00",s:"NRG Stadium"},
  {h:"Ghana",a:"Panamá",d:"17 Jun · 13:00",s:"Toronto Stadium"},
  {h:"Inglaterra",a:"Croacia",d:"17 Jun · 14:00",s:"AT&T Stadium"},
  {h:"Uzbekistán",a:"Colombia",d:"17 Jun · 19:00",s:"Estadio Azteca"}
];

let currentUser = "", currentCode = "", locked = false, picks = {}, pwCallback = null;

// INIT
(function(){
  const sC = localStorage.getItem("wc26_code"), sU = localStorage.getItem("wc26_user");
  if(sC && sU){ currentCode = sC; currentUser = sU; loadData(); showApp(); }
})();

function doLogin(){
  const c = document.getElementById("codeInput").value.toUpperCase();
  if(USER_CODES[c]){
    currentCode = c; currentUser = USER_CODES[c];
    localStorage.setItem("wc26_code", c); localStorage.setItem("wc26_user", currentUser);
    loadData(); showApp();
  } else { document.getElementById("loginErr").textContent = "Código inválido."; }
}

function loadData(){
  picks = JSON.parse(localStorage.getItem("wc26_picks_" + currentCode) || "{}");
  locked = localStorage.getItem("wc26_lock_" + currentCode) === "1";
}

function showApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("displayUser").textContent = "👤 " + currentUser;
  document.getElementById("capUser").textContent = currentUser;
  renderMatches();
  updateStatusUI();
}

function renderMatches(){
  const mc = document.getElementById("matchesContainer");
  mc.innerHTML = MATCHES.map((m, idx) => {
    const hV = picks[`j1_${idx}_h`] || "", aV = picks[`j1_${idx}_a`] || "";
    return `
      <div class="match ${hV!=='' && aV!=='' ? 'filled' : ''}">
        <div class="match-top">
          <div class="team" style="text-align:right;">${m.h}</div>
          <div style="display:flex; align-items:center; gap:8px;">
            <input class="score" type="number" value="${hV}" ${locked?'disabled':''} oninput="updatePick(${idx},'h',this)">
            <span style="font-family:'Bebas Neue'; color:var(--gold); opacity:0.5;">:</span>
            <input class="score" type="number" value="${aV}" ${locked?'disabled':''} oninput="updatePick(${idx},'a',this)">
          </div>
          <div class="team">${m.a}</div>
        </div>
        <div style="margin-top:10px; font-size:0.7rem; color:var(--muted); text-align:center;">
          ${m.d} | ${m.s}
        </div>
      </div>
    `;
  }).join('');
  updateProgress();
}

function updatePick(idx, side, el){
  picks[`j1_${idx}_${side}`] = el.value.slice(0,2);
  const h = picks[`j1_${idx}_h`], a = picks[`j1_${idx}_a`];
  el.closest(".match").classList.toggle("filled", (h && a));
  updateProgress();
}

function updateProgress(){
  let done = 0;
  MATCHES.forEach((m, i) => { if(picks[`j1_${i}_h`] && picks[`j1_${i}_a`]) done++; });
  document.getElementById("statusProgress").textContent = `${done} / 24 completados`;
}

function updateStatusUI(){
  const txt = document.getElementById("statusText");
  txt.textContent = locked ? "CERRADO 🔒" : "ABIERTO 🟢";
  txt.style.color = locked ? "var(--red)" : "var(--green)";
}

function savePicks(){
  if(locked) return showToast("🔒 Pronósticos bloqueados");
  localStorage.setItem("wc26_picks_" + currentCode, JSON.stringify(picks));
  showToast("💾 Guardado correctamente");
}

function handleLock(){
  if(locked) return;
  if(!confirm("¿Bloquear permanentemente?")) return;
  locked = true;
  localStorage.setItem("wc26_lock_" + currentCode, "1");
  savePicks(); renderMatches(); updateStatusUI();
}

function handleUnlock(){
  openPwModal("ADMIN: DESBLOQUEAR", "Se requiere clave para permitir cambios", function(){
    locked = false; localStorage.setItem("wc26_lock_" + currentCode, "0");
    renderMatches(); updateStatusUI(); showToast("🔓 Desbloqueado");
  });
}

// LÓGICA DE EXPORTACIÓN CON VALIDACIÓN DE CONTRASEÑA
function handleExport(){
  if(!locked){
    openPwModal("ADMIN: EXPORTAR", "Los pronósticos están ABIERTOS. Se requiere clave para generar la imagen.", function(){
      doExport();
    });
  } else {
    doExport();
  }
}

function doExport(){
  showToast("📸 Generando imagen...");
  const area = document.getElementById("captureArea");
  const header = document.getElementById("captureHeader");
  const stLabel = document.getElementById("capStatus");
  
  // Configurar label de estado en imagen
  stLabel.textContent = locked ? "PRONÓSTICO CERRADO" : "PRONÓSTICO ABIERTO";
  stLabel.style.background = locked ? "var(--red)" : "var(--green)";
  stLabel.style.color = "#fff";

  header.style.display = "block";
  const inputs = area.querySelectorAll("input");
  const backups = [];

  inputs.forEach(inp => {
    const div = document.createElement("div");
    div.className = inp.className;
    div.style.display = "flex"; div.style.alignItems = "center"; div.style.justifyContent = "center";
    div.textContent = inp.value || "-";
    backups.push({original: inp, div: div});
    inp.style.display = "none";
    inp.parentNode.insertBefore(div, inp);
  });

  html2canvas(area, { scale: 2, backgroundColor: "#0a0e1a" }).then(canvas => {
    backups.forEach(b => { b.div.remove(); b.original.style.display = ""; });
    header.style.display = "none";
    const link = document.createElement("a");
    link.download = `Pronostico_${currentUser.replace(/ /g,"_")}.jpg`;
    link.href = canvas.toDataURL("image/jpeg", 0.9);
    link.click();
  });
}

function openPwModal(t, d, cb){
  document.getElementById("pwTitle").textContent = t;
  document.getElementById("pwDesc").textContent = d;
  document.getElementById("pwInput").value = "";
  document.getElementById("pwModal").classList.add("show");
  pwCallback = cb;
}
function closePwModal(){ document.getElementById("pwModal").classList.remove("show"); }
function confirmPwModal(){
  if(document.getElementById("pwInput").value === ADMIN_PASS){
    closePwModal(); if(pwCallback) pwCallback();
  } else { alert("Clave incorrecta"); }
}
function showToast(m){
  const t = document.getElementById("toast"); t.textContent = m;
  t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 3000);
}
</script>
</body>
</html>
