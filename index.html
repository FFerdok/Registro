<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f172a" />

<title>Mundial 2026 - QUINIELA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

:root{

  --gold:#f5c518;
  --gold2:#c9900a;

  --bg:#090909;
  --bg2:#101010;

  --card:#171717;
  --card2:#1d1d1d;

  --line:#2f2f2f;

  --text:#f5f5f5;
  --muted:#8f8f8f;

  --green:#16a34a;
  --red:#dc2626;
  --blue:#2563eb;

}

body.light{

  --bg:#eef2ff;
  --bg2:#ffffff;

  --card:#ffffff;
  --card2:#f8fafc;

  --line:#d6d6d6;

  --text:#111827;
  --muted:#6b7280;

}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  font-family:'Exo 2',sans-serif;
}

body{

  background:var(--bg);
  color:var(--text);

  overflow-x:hidden;
  min-height:100vh;

  position:relative;

}

/* =====================================================
   FONDO ESTADIO
===================================================== */

body::before{

  content:'';

  position:fixed;
  inset:0;

  background:
  linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.84)),
  url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1920&auto=format&fit=crop');

  background-size:cover;
  background-position:center;

  z-index:-3;

  animation:stadiumMove 28s infinite alternate ease-in-out;

}

body.light::before{

  filter:brightness(1.08);

}

@keyframes stadiumMove{

  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.08);
  }

}

/* =====================================================
   REFLECTORES
===================================================== */

.stadium-lights{

  position:fixed;
  inset:0;

  pointer-events:none;
  z-index:-2;

}

.reflector{

  position:absolute;

  width:500px;
  height:500px;

  border-radius:50%;

  filter:blur(90px);

  background:
  radial-gradient(circle,
  rgba(255,255,255,.12),
  transparent 70%);

  animation:moveLight 15s infinite alternate ease-in-out;

}

.ref-1{
  top:-10%;
  left:-10%;
}

.ref-2{
  right:-10%;
  bottom:-10%;
  animation-duration:18s;
}

.ref-3{
  top:20%;
  right:-15%;
  animation-duration:20s;
}

.ref-4{
  left:-15%;
  bottom:10%;
  animation-duration:16s;
}

@keyframes moveLight{

  0%{
    transform:translate(0,0) scale(1);
  }

  50%{
    transform:translate(120px,90px) scale(1.2);
  }

  100%{
    transform:translate(-80px,140px) scale(.85);
  }

}

/* =====================================================
   LOGIN
===================================================== */

.login-screen{

  position:fixed;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:100;

}

.login-card{

  width:100%;
  max-width:420px;

  background:
  linear-gradient(
  180deg,
  rgba(20,20,20,.92),
  rgba(8,8,8,.95)
  );

  border:1px solid rgba(255,255,255,.08);

  border-radius:34px;

  padding:38px 30px;

  position:relative;
  overflow:hidden;

  backdrop-filter:blur(18px);

  box-shadow:
  0 25px 80px rgba(0,0,0,.65);

  animation:loginEnter .8s cubic-bezier(.2,.8,.2,1);

}

body.light .login-card{

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,.94),
  rgba(245,245,245,.96)
  );

}

.login-card::before{

  content:'';

  position:absolute;
  inset:0;

  background:
  linear-gradient(
  135deg,
  rgba(245,197,24,.12),
  transparent 30%
  );

}

@keyframes loginEnter{

  from{
    opacity:0;
    transform:translateY(50px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.pitch-lines{

  position:absolute;
  inset:0;

  pointer-events:none;
  opacity:.06;

}

.pitch-lines::before{

  content:'';

  position:absolute;

  left:20%;
  right:20%;
  top:0;
  bottom:0;

  border:2px solid #fff;
  border-radius:18px;

}

.pitch-lines::after{

  content:'';

  position:absolute;

  width:130px;
  height:130px;

  border:2px solid #fff;
  border-radius:50%;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

}

.fifa-logo{

  width:110px;

  display:block;
  margin:auto;

  margin-bottom:14px;

  filter:
  drop-shadow(0 0 20px rgba(245,197,24,.35));

  animation:logoFloat 5s infinite ease-in-out;

}

@keyframes logoFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-8px);
  }

}

.trophy-container{

  font-size:4rem;
  text-align:center;

  margin-bottom:10px;

  animation:trophyMove 4s infinite ease-in-out;

}

@keyframes trophyMove{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-12px) rotate(5deg);
  }

}

/* =====================================================
   APP
===================================================== */

.app{

  position:relative;
  z-index:5;

}

.main{

  max-width:1300px;

  margin:auto;
  padding:18px;

}

/* =====================================================
   BANNER FIFA
===================================================== */

.fifa-banner{

  position:relative;
  overflow:hidden;

  padding:28px;

  border-radius:30px;

  margin-bottom:20px;

  border:1px solid rgba(255,255,255,.08);

  background:
  linear-gradient(
  135deg,
  rgba(0,0,0,.85),
  rgba(18,18,18,.95)
  );

  backdrop-filter:blur(12px);

  box-shadow:
  0 20px 50px rgba(0,0,0,.4);

}

body.light .fifa-banner{

  background:
  linear-gradient(
  135deg,
  rgba(255,255,255,.94),
  rgba(245,245,245,.96)
  );

}

.fifa-banner::after{

  content:'';

  position:absolute;
  inset:0;

  background:
  linear-gradient(
  90deg,
  transparent,
  rgba(255,255,255,.08),
  transparent
  );

  transform:translateX(-100%);

  animation:bannerShine 7s infinite;

}

@keyframes bannerShine{

  0%{
    transform:translateX(-100%);
  }

  30%{
    transform:translateX(140%);
  }

  100%{
    transform:translateX(140%);
  }

}

/* =====================================================
   BOTONES
===================================================== */

.actions{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(160px,1fr));

  gap:14px;

  margin-bottom:20px;

}

.action-btn{

  height:64px;

  border:none;
  border-radius:22px;

  color:#fff;

  cursor:pointer;

  font-weight:800;
  font-size:.9rem;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  position:relative;
  overflow:hidden;

  backdrop-filter:blur(14px);

  transition:
  transform .25s ease,
  box-shadow .25s ease;

  box-shadow:
  0 12px 30px rgba(0,0,0,.28);

}

.action-btn:hover{

  transform:
  translateY(-4px)
  scale(1.02);

}

.action-btn::before{

  content:'';

  position:absolute;
  inset:0;

  background:
  linear-gradient(
  135deg,
  rgba(255,255,255,.18),
  transparent 50%
  );

}

.action-btn::after{

  content:'';

  position:absolute;

  top:0;
  left:-120%;

  width:50%;
  height:100%;

  background:
  linear-gradient(
  90deg,
  transparent,
  rgba(255,255,255,.22),
  transparent
  );

  transform:skewX(-20deg);

  animation:btnShine 6s infinite;

}

@keyframes btnShine{

  0%{
    left:-120%;
  }

  30%{
    left:150%;
  }

  100%{
    left:150%;
  }

}

.btn-save{
  background:linear-gradient(135deg,#f5c518,#d4a017);
}

.btn-export{
  background:linear-gradient(135deg,#16a34a,#15803d);
}

.btn-lock{
  background:linear-gradient(135deg,#dc2626,#991b1b);
}

.btn-unlock{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
}

.btn-theme{
  background:linear-gradient(135deg,#7c3aed,#5b21b6);
}

/* =====================================================
   STATUS
===================================================== */

.status-bar{

  background:
  linear-gradient(
  180deg,
  rgba(20,20,20,.92),
  rgba(10,10,10,.96)
  );

  border:1px solid rgba(255,255,255,.08);

  border-radius:22px;

  padding:16px 20px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:20px;

  backdrop-filter:blur(10px);

}

body.light .status-bar{

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,.92),
  rgba(245,245,245,.98)
  );

}

/* =====================================================
   PARTIDOS
===================================================== */

.matches{

  display:grid;

  grid-template-columns:
  repeat(2,minmax(0,1fr));

  gap:14px;

}

.match{

  position:relative;
  overflow:hidden;

  background:
  linear-gradient(
  180deg,
  rgba(25,25,25,.96),
  rgba(12,12,12,.98)
  );

  border:1px solid rgba(255,255,255,.08);

  border-radius:24px;

  padding:14px;

  backdrop-filter:blur(12px);

  box-shadow:
  0 12px 28px rgba(0,0,0,.28);

  animation:cardEnter .6s cubic-bezier(.23,1,.32,1);

}

body.light .match{

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,.94),
  rgba(245,245,245,.98)
  );

}

.match::before{

  content:'';

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:4px;

  background:var(--gold);

  opacity:.15;

}

.match.filled::before{

  opacity:1;

  box-shadow:
  0 0 18px var(--gold);

}

@keyframes cardEnter{

  from{
    opacity:0;
    transform:translateY(25px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.match-top{

  display:grid;

  grid-template-columns:
  minmax(0,1fr)
  auto
  minmax(0,1fr);

  align-items:center;

  gap:8px;

}

.team{

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:6px;

  min-width:0;

}

.team span{

  font-size:.72rem;
  font-weight:700;

  text-align:center;

  line-height:1.1;

  overflow:hidden;
  text-overflow:ellipsis;

  width:100%;

}

.flag{

  width:34px;
  height:22px;

  border-radius:5px;

  object-fit:cover;

  border:1px solid rgba(255,255,255,.15);

  transition:
  transform .25s ease,
  box-shadow .25s ease;

}

.match:hover .flag{

  transform:scale(1.08);

  box-shadow:
  0 0 16px rgba(255,255,255,.18);

}

.score-area{

  display:flex;
  align-items:center;
  gap:4px;

}

.score{

  width:42px;
  height:42px;

  border-radius:12px;

  border:2px solid rgba(255,255,255,.08);

  background:rgba(0,0,0,.22);

  color:var(--gold);

  text-align:center;

  font-size:1.3rem;

  font-family:'Bebas Neue',sans-serif;

  outline:none;

}

body.light .score{

  background:#fff;

}

.match-info{

  margin-top:10px;

  text-align:center;

  font-size:.55rem;

  color:var(--muted);

  line-height:1.3;

}

/* =====================================================
   MODAL
===================================================== */

.modal-overlay{

  position:fixed;
  inset:0;

  background:rgba(0,0,0,.82);

  backdrop-filter:blur(8px);

  display:none;

  align-items:center;
  justify-content:center;

  z-index:9999;

}

.modal-card{

  width:90%;
  max-width:340px;

  background:
  linear-gradient(
  180deg,
  rgba(18,18,18,.96),
  rgba(8,8,8,.98)
  );

  border:1px solid rgba(255,255,255,.08);

  border-radius:28px;

  padding:30px;

  text-align:center;

}

body.light .modal-card{

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,.94),
  rgba(245,245,245,.98)
  );

}

/* =====================================================
   GOAL OVERLAY
===================================================== */

#goalOverlay{

  position:fixed;
  inset:0;

  background:rgba(0,0,0,.95);

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  z-index:10000;

}

#flash-container{

  position:fixed;
  inset:0;

  pointer-events:none;

  display:none;

  z-index:10001;

}

.camera-burst{

  position:absolute;

  width:160px;
  height:160px;

  background:#fff;

  border-radius:50%;

  filter:blur(50px);

  opacity:0;

  animation:flash .3s ease-out forwards;

}

@keyframes flash{

  0%{
    opacity:0;
    transform:scale(.2);
  }

  50%{
    opacity:1;
    transform:scale(1.4);
  }

  100%{
    opacity:0;
    transform:scale(2);
  }

}

/* =====================================================
   TOAST
===================================================== */

#toast{

  position:fixed;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  padding:12px 22px;

  border-radius:999px;

  background:#16a34a;

  color:#fff;

  display:none;

  z-index:12000;

  font-weight:700;

}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:820px){

  .matches{

    grid-template-columns:
    repeat(2,minmax(0,1fr));

    gap:10px;

  }

  .match{

    padding:10px;

    border-radius:20px;

  }

  .team span{

    font-size:.6rem;

  }

  .flag{

    width:28px;
    height:18px;

  }

  .score{

    width:34px;
    height:34px;

    font-size:1rem;
  }

  .match-info{

    font-size:.48rem;

  }

}

@media(max-width:560px){

  .actions{

    grid-template-columns:
    repeat(2,minmax(0,1fr));

  }

  .action-btn{

    height:58px;

    font-size:.75rem;

  }

}

</style>
</head>

===================================================== */

  {h:"México",a:"Sudáfrica",d:"11 Jun · 13:00",s:"Estadio Azteca"},
  {h:"Corea del Sur",a:"Rep. Checa",d:"11 Jun · 20:00",s:"Estadio Akron"},
  {h:"Canadá",a:"Bosnia y Herz.",d:"12 Jun · 13:00",s:"Toronto Stadium"},
  {h:"Estados Unidos",a:"Paraguay",d:"12 Jun · 19:00",s:"SoFi Stadium"},
  {h:"Qatar",a:"Suiza",d:"13 Jun · 13:00",s:"Bay Area Stadium"},
  {h:"Brasil",a:"Marruecos",d:"13 Jun · 16:00",s:"MetLife Stadium"},
  {h:"Haití",a:"Escocia",d:"13 Jun · 19:00",s:"Gillette Stadium"},
  {h:"Australia",a:"Turquía",d:"13 Jun · 22:00",s:"BC Place"},
  {h:"Alemania",a:"Curazao",d:"14 Jun · 11:00",s:"NRG Stadium"},
  {h:"Países Bajos",a:"Japón",d:"14 Jun · 14:00",s:"AT&T Stadium"},
  {h:"Costa de Marfil",a:"Ecuador",d:"14 Jun · 17:00",s:"Lincoln Financial"},
  {h:"Suecia",a:"Túnez",d:"14 Jun · 20:00",s:"Estadio BBVA"},
  {h:"España",a:"Cabo Verde",d:"15 Jun · 10:00",s:"Mercedes-Benz Stadium"},
  {h:"Bélgica",a:"Egipto",d:"15 Jun · 13:00",s:"Lumen Field"},
  {h:"Arabia Saudita",a:"Uruguay",d:"15 Jun · 16:00",s:"Hard Rock Stadium"},

  {h:"Argentina",a:"Argelia",d:"16 Jun · 16:00",s:"Arrowhead Stadium"},
  {h:"Irak",a:"Noruega",d:"16 Jun · 19:00",s:"Gillette Stadium"},
  {h:"Austria",a:"Jordania",d:"16 Jun · 19:00",s:"Bay Area Stadium"},
  {h:"Portugal",a:"RD Congo",d:"17 Jun · 11:00",s:"NRG Stadium"},
  {h:"Ghana",a:"Panamá",d:"17 Jun · 13:00",s:"Toronto Stadium"},
  {h:"Inglaterra",a:"Croacia",d:"17 Jun · 14:00",s:"AT&T Stadium"},
  {h:"Uzbekistán",a:"Colombia",d:"17 Jun · 19:00",s:"Estadio Azteca"}

];

/* =====================================================
   STATE
===================================================== */

let currentUser = "";
let currentCode = "";

let locked = false;

let picks = {};

let mCallback = null;

/* =====================================================
   LOGIN PREVIEW
===================================================== */

document.getElementById("codeInput")
.addEventListener("input",function(){

  const n =
  USER_CODES[this.value.toUpperCase()];

  document.getElementById("loginPreview")
  .textContent =
  n ? "HOLA, " + n + "!" : "";

});

/* =====================================================
   LOGIN
===================================================== */

function doLogin(){

  const c =
  document.getElementById("codeInput")
  .value.toUpperCase();

  if(USER_CODES[c]){

    document.getElementById("stadiumIntro")
    .play()
    .catch(()=>{});

    setTimeout(()=>{

      document.getElementById("fifaSound")
      .play()
      .catch(()=>{});

    },400);

    currentUser = USER_CODES[c];
    currentCode = c;

    loadData();

    const login =
    document.getElementById("loginScreen");

    login.style.transition =
    ".7s cubic-bezier(.2,.8,.2,1)";

    login.style.opacity = "0";

    login.style.transform =
    "scale(1.08)";

    setTimeout(()=>{

      showApp();

    },650);

  }else{

    alert("CÓDIGO INVÁLIDO");

  }

}

/* =====================================================
   LOAD
===================================================== */

function loadData(){

  picks =
  JSON.parse(
  localStorage.getItem(
  "wc26_picks_" + currentCode
  ) || "{}"
  );

  locked =
  localStorage.getItem(
  "wc26_lock_" + currentCode
  ) === "1";

}

/* =====================================================
   SHOW APP
===================================================== */

function showApp(){

  document.getElementById("loginScreen")
  .style.display = "none";

  document.getElementById("app")
  .style.display = "block";

  document.getElementById("displayUser")
  .textContent = currentUser;

  renderMatches();

  updateStatusUI();

}

/* =====================================================
   RENDER
===================================================== */

function renderMatches(){

  const mc =
  document.getElementById("matchesContainer");

  mc.innerHTML =
  MATCHES.map((m,idx)=>{

    const hV =
    picks[`j1_${idx}_h`] || "";

    const aV =
    picks[`j1_${idx}_a`] || "";

    return `

    <div class="match ${hV !== '' && aV !== '' ? 'filled':''}"
    style="animation-delay:${idx * .04}s">

      <div class="match-top">

        <div class="team">

          <img class="flag"
          src="https://flagcdn.com/w80/${FLAGS[m.h] || "un"}.png">

          <span>${m.h}</span>

        </div>

        <div class="score-area">

          <input
          class="score"
          type="number"
          value="${hV}"
          ${locked ? 'disabled':''}
          oninput="updatePick(${idx},'h',this)">

          <span style="
          color:var(--gold);
          font-family:'Bebas Neue';
          ">
            :
          </span>

          <input
          class="score"
          type="number"
          value="${aV}"
          ${locked ? 'disabled':''}
          oninput="updatePick(${idx},'a',this)">

        </div>

        <div class="team">

          <img class="flag"
          src="https://flagcdn.com/w80/${FLAGS[m.a] || "un"}.png">

          <span>${m.a}</span>

        </div>

      </div>

      <div class="match-info">

        ${m.d}<br>
        ${m.s}

      </div>

    </div>

    `;

  }).join("");

}

/* =====================================================
   PICKS
===================================================== */

function updatePick(idx,side,el){

  picks[`j1_${idx}_${side}`] =
  el.value.slice(0,2);

  el.closest(".match")
  .classList.toggle(
  "filled",
  picks[`j1_${idx}_h`] &&
  picks[`j1_${idx}_a`]
  );

}

/* =====================================================
   STATUS
===================================================== */

function updateStatusUI(){

  const s =
  document.getElementById("statusText");

  s.innerHTML =
  locked ?
  "ESTADO: CERRADO 🔒" :
  "ESTADO: ABIERTO 🟢";

  s.style.color =
  locked ?
  "var(--red)" :
  "var(--green)";

}

/* =====================================================
   SAVE
===================================================== */

function savePicks(){

  if(locked){

    toast("🔒 PRONÓSTICOS CERRADOS");
    return;

  }

  localStorage.setItem(
  "wc26_picks_" + currentCode,
  JSON.stringify(picks)
  );

  toast("💾 PRONÓSTICOS GUARDADOS");

}

/* =====================================================
   LOCK
===================================================== */

function handleLock(){

  if(locked) return;

  if(confirm("¿BLOQUEAR PRONÓSTICOS?")){

    locked = true;

    localStorage.setItem(
    "wc26_lock_" + currentCode,
    "1"
    );

    savePicks();

    renderMatches();

    updateStatusUI();

    toast("🔒 PRONÓSTICOS BLOQUEADOS");

  }

}

/* =====================================================
   MODAL
===================================================== */

function openM(title,desc,cb){

  document.getElementById("mTitle")
  .textContent = title;

  document.getElementById("mDesc")
  .textContent = desc;

  document.getElementById("mInput")
  .value = "";

  document.getElementById("masterModal")
  .style.display = "flex";

  mCallback = cb;

}

function closeM(){

  document.getElementById("masterModal")
  .style.display = "none";

}

function confirmM(){

  if(
  document.getElementById("mInput")
  .value === ADMIN_PASS
  ){

    closeM();

    if(mCallback)
    mCallback();

  }else{

    alert("CLAVE INCORRECTA");

  }

}

/* =====================================================
   UNLOCK
===================================================== */

function handleUnlock(){

  openM(
  "DESBLOQUEAR",
  "Ingresa clave de administración",

  function(){

    locked = false;

    localStorage.setItem(
    "wc26_lock_" + currentCode,
    "0"
    );

    renderMatches();

    updateStatusUI();

    toast("🔓 PRONÓSTICOS ABIERTOS");

  });

}

/* =====================================================
   EXPORT
===================================================== */

function handleExport(){

  if(!locked){

    openM(
    "EXPORTAR",
    "Pronósticos ABIERTOS. Se requiere clave.",

    doExport
    );

  }else{

    doExport();

  }

}

function doExport(){

  document.getElementById("transitionSound")
  .play()
  .catch(()=>{});

  const flashes =
  document.getElementById("flash-container");

  flashes.style.display = "block";

  for(let i=0;i<28;i++){

    setTimeout(()=>{

      const b =
      document.createElement("div");

      b.className = "camera-burst";

      b.style.top =
      Math.random()*100 + "%";

      b.style.left =
      Math.random()*100 + "%";

      flashes.appendChild(b);

      setTimeout(()=>{

        b.remove();

      },300);

    },i * 35);

  }

  setTimeout(()=>{

    const overlay =
    document.getElementById("goalOverlay");

    overlay.style.display = "flex";

    setTimeout(()=>{

      const area =
      document.getElementById("captureArea");

      const header =
      document.getElementById("captureHeader");

      header.style.display = "block";

      document.getElementById("capStatus")
      .textContent =
      locked ?
      "PRONÓSTICO CERRADO" :
      "PRONÓSTICO ABIERTO";

      document.getElementById("capUser")
      .textContent = currentUser;

      const inputs =
      area.querySelectorAll("input");

      const backups = [];

      inputs.forEach(inp=>{

        const rep =
        document.createElement("div");

        rep.className = inp.className;

        rep.style.height = "42px";
        rep.style.lineHeight = "42px";

        rep.style.display = "inline-block";

        rep.textContent =
        inp.value || "-";

        backups.push({
          orig:inp,
          rep:rep
        });

        inp.style.display = "none";

        inp.parentNode.insertBefore(rep,inp);

      });

      html2canvas(area,{

        scale:2,
        backgroundColor:"#090909",
        useCORS:true

      }).then(canvas=>{

        backups.forEach(b=>{

          b.rep.remove();

          b.orig.style.display =
          "inline-block";

        });

        header.style.display = "none";

        overlay.style.display = "none";

        flashes.style.display = "none";

        const link =
        document.createElement("a");

        link.download =
        `WC26_${currentUser}.jpg`;

        link.href =
        canvas.toDataURL(
        "image/jpeg",
        .95
        );

        link.click();

      });

    },1200);

  },350);

}

/* =====================================================
   THEME
===================================================== */

function toggleTheme(){

  document.body.classList.toggle("light");

  localStorage.setItem(
  "wc26_theme",
  document.body.classList.contains("light")
  ? "light"
  : "dark"
  );

}

/* =====================================================
   LOAD THEME
===================================================== */

if(
localStorage.getItem("wc26_theme")
=== "light"
){

  document.body.classList.add("light");

}

/* =====================================================
   TOAST
===================================================== */

function toast(m){

  const t =
  document.getElementById("toast");

  t.textContent = m;

  t.style.display = "block";

  setTimeout(()=>{

    t.style.display = "none";

  },2500);

}

</script>
