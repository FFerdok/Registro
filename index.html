<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0f1a">
<title>Mundial 2026 - QUINIELA 8vos de Final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{--gold:#f5c518;--gold2:#d4a017;--green:#16a34a;--red:#dc2626;--blue:#2563eb;--bg:#090909;--bg2:#101010;--card:#171717;--card2:#1f1f1f;--line:#2b2b2b;--text:#f4f4f4;--muted:#909090;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Exo 2',sans-serif;}
body{background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;position:relative;}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.88)),url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1920&auto=format&fit=crop');background-size:cover;background-position:center;z-index:-5;animation:stadiumZoom 28s infinite alternate ease-in-out;}
@keyframes stadiumZoom{from{transform:scale(1);}to{transform:scale(1.08);}}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(circle at top,rgba(245,197,24,.08),transparent 35%);pointer-events:none;z-index:-4;animation:ambientMove 10s infinite alternate ease-in-out;}
@keyframes ambientMove{from{opacity:.7;transform:translateY(0);}to{opacity:1;transform:translateY(18px);}}
.stadium-lights{position:fixed;inset:0;pointer-events:none;z-index:-3;}
.reflector{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);filter:blur(90px);animation:lightMove 18s infinite alternate ease-in-out;}
.ref-1{top:-10%;left:-10%;}.ref-2{right:-10%;bottom:-10%;animation-duration:22s;}.ref-3{top:10%;right:-15%;animation-duration:20s;}.ref-4{left:-15%;bottom:10%;animation-duration:16s;}
@keyframes lightMove{0%{transform:translate(0,0) scale(1);}50%{transform:translate(120px,100px) scale(1.18);}100%{transform:translate(-60px,180px) scale(.9);}}
.login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.login-card{width:100%;max-width:420px;position:relative;overflow:hidden;border-radius:34px;padding:40px 30px;background:linear-gradient(180deg,rgba(20,20,20,.95),rgba(8,8,8,.98));border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.65);animation:loginEnter .8s cubic-bezier(.2,.8,.2,1);}
@keyframes loginEnter{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}
.pitch-lines{position:absolute;inset:0;opacity:.05;pointer-events:none;}
.pitch-lines::before{content:'';position:absolute;top:0;bottom:0;left:18%;right:18%;border:2px solid #fff;border-radius:20px;}
.pitch-lines::after{content:'';position:absolute;width:120px;height:120px;border:2px solid #fff;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);}
.trophy-container{font-size:5rem;text-align:center;margin-bottom:10px;filter:drop-shadow(0 0 20px rgba(245,197,24,.4));animation:trophyMove 4s infinite ease-in-out;}
@keyframes trophyMove{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px) rotate(5deg);}}
.login-title{font-family:'Bebas Neue';text-align:center;font-size:3rem;color:var(--gold);letter-spacing:2px;}
.login-sub{text-align:center;color:var(--muted);margin-bottom:24px;letter-spacing:4px;font-size:.82rem;}
.login-input{width:100%;height:66px;border-radius:18px;border:2px solid rgba(255,255,255,.08);background:rgba(255,255,255,.06);color:var(--gold);outline:none;text-align:center;font-size:1.7rem;font-family:'Bebas Neue';letter-spacing:8px;padding:0 18px;transition:.25s ease;position:relative;z-index:5;}
.login-input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,197,24,.12),0 0 20px rgba(245,197,24,.18);}
.login-input::placeholder{color:rgba(245,197,24,.55);}
#loginPreview{height:22px;text-align:center;color:var(--gold);margin:16px 0 20px;font-weight:700;}
.app{position:relative;z-index:5;}
.main{max-width:1350px;margin:auto;padding:18px;}
.fifa-banner{position:relative;overflow:hidden;padding:30px;border-radius:34px;margin-bottom:22px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(135deg,rgba(8,8,8,.95),rgba(18,18,18,.97));backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);}
.banner-glow{position:absolute;width:420px;height:420px;background:radial-gradient(circle,rgba(245,197,24,.22),transparent 70%);top:-150px;right:-100px;filter:blur(40px);animation:glowMove 8s infinite alternate ease-in-out;}
@keyframes glowMove{from{transform:translateY(0) scale(1);}to{transform:translateY(40px) scale(1.2);}}
.banner-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.banner-particles span{position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(245,197,24,.8);box-shadow:0 0 12px rgba(245,197,24,.9);animation:floatParticle linear infinite;}
.banner-particles span:nth-child(1){left:10%;top:80%;animation-duration:8s;}.banner-particles span:nth-child(2){left:30%;top:90%;animation-duration:11s;}.banner-particles span:nth-child(3){left:55%;top:100%;animation-duration:9s;}.banner-particles span:nth-child(4){left:75%;top:85%;animation-duration:13s;}.banner-particles span:nth-child(5){left:92%;top:95%;animation-duration:10s;}
@keyframes floatParticle{from{transform:translateY(0) scale(.7);opacity:0;}20%{opacity:1;}to{transform:translateY(-220px) scale(1.2);opacity:0;}}
.wc-logo-container{position:relative;width:90px;height:90px;display:flex;align-items:center;justify-content:center;}
.wc-pulse{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(245,197,24,.5);animation:pulseRing 2.6s infinite;}
@keyframes pulseRing{0%{transform:scale(.8);opacity:1;}100%{transform:scale(1.5);opacity:0;}}
.wc-ball{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:linear-gradient(135deg,rgba(245,197,24,.2),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(245,197,24,.2);animation:ballFloat 4s infinite ease-in-out;}
@keyframes ballFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.banner-title{font-family:'Bebas Neue';font-size:clamp(2.5rem,7vw,5rem);letter-spacing:2px;line-height:1;}
.banner-subtitle{font-family:'Bebas Neue';color:var(--gold);font-size:1.6rem;letter-spacing:8px;margin-top:4px;text-shadow:0 0 16px rgba(245,197,24,.4);}
.live-badge{display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);font-family:'Bebas Neue';letter-spacing:3px;font-size:1rem;}
.live-dot{width:12px;height:12px;border-radius:50%;background:#22c55e;box-shadow:0 0 18px #22c55e;animation:liveBlink 1s infinite;}
@keyframes liveBlink{0%,100%{opacity:1;}50%{opacity:.35;}}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:22px;}
.wc-action{position:relative;overflow:hidden;height:88px;border:none;border-radius:28px;cursor:pointer;display:flex;align-items:center;gap:18px;padding:0 22px;color:#fff;transition:transform .25s ease,box-shadow .25s ease;backdrop-filter:blur(14px);box-shadow:0 16px 35px rgba(0,0,0,.32);}
.wc-action:hover{transform:translateY(-4px) scale(1.02);}
.wc-action::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.16),transparent 60%);}
.wc-action::after{content:'';position:absolute;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);right:-80px;top:-80px;transition:.35s ease;}
.wc-action:hover::after{transform:scale(1.25);}
.wc-icon{min-width:56px;width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);}
.wc-btn-content{display:flex;flex-direction:column;align-items:flex-start;position:relative;z-index:2;}
.wc-btn-content span{font-weight:800;font-size:1rem;}
.wc-btn-content small{opacity:.75;font-size:.72rem;margin-top:2px;}
.save-btn{background:linear-gradient(135deg,#f5c518,#c9900a);}.export-btn{background:linear-gradient(135deg,#16a34a,#0f7a35);}.lock-btn{background:linear-gradient(135deg,#dc2626,#991b1b);}.unlock-btn{background:linear-gradient(135deg,#2563eb,#1d4ed8);}
.status-bar{background:linear-gradient(180deg,rgba(20,20,20,.92),rgba(10,10,10,.96));border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;backdrop-filter:blur(10px);}
.matches{display:grid;grid-template-columns:1fr;gap:16px;max-width:800px;margin:0 auto;}
.match{position:relative;overflow:hidden;border-radius:28px;padding:24px 20px 20px;background:linear-gradient(180deg,rgba(22,22,22,.96),rgba(10,10,10,.98));border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);box-shadow:0 8px 20px rgba(0,0,0,.28);transition:transform .25s ease,border-color .25s ease;display:flex;flex-direction:column;gap:14px;}
.match:hover{transform:translateY(-3px);border-color:rgba(245,197,24,.28);}
.match::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold);opacity:.15;}
.match.filled::before{opacity:1;box-shadow:0 0 18px var(--gold);}
.match::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 60%);pointer-events:none;}
.match-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;position:relative;z-index:1;}
.team{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;}
.flag{width:56px;height:36px;border-radius:6px;object-fit:cover;border:1px solid rgba(255,255,255,.18);box-shadow:0 4px 12px rgba(0,0,0,.4);}
.team-name{width:100%;text-align:center;font-size:.9rem;font-weight:700;line-height:1.2;word-break:break-word;hyphens:auto;color:var(--text);padding:0 4px;}
.score{width:60px;height:56px;border-radius:14px;border:2px solid rgba(255,255,255,.1);background:rgba(0,0,0,.35);color:var(--gold);text-align:center;font-size:1.8rem;font-family:'Bebas Neue';outline:none;transition:border-color .2s ease,box-shadow .2s ease;}
.score:focus{border-color:rgba(245,197,24,.5);box-shadow:0 0 0 3px rgba(245,197,24,.1);}
.score-sep{color:var(--gold);font-family:'Bebas Neue';font-size:2rem;line-height:56px;opacity:.8;padding-bottom:0;}
.match-info{text-align:center;font-size:.75rem;color:var(--muted);line-height:1.6;letter-spacing:.2px;position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.05);padding-top:10px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:9999;}
.modal-card{width:90%;max-width:340px;border-radius:28px;padding:30px;background:linear-gradient(180deg,rgba(18,18,18,.96),rgba(8,8,8,.98));border:1px solid rgba(255,255,255,.08);text-align:center;}
#goalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10000;}
#flash-container{position:fixed;inset:0;display:none;pointer-events:none;z-index:10001;}
.camera-burst{position:absolute;width:160px;height:160px;border-radius:50%;background:#fff;filter:blur(50px);opacity:0;animation:flash .3s ease-out forwards;}
@keyframes flash{0%{opacity:0;transform:scale(.2);}50%{opacity:1;transform:scale(1.4);}100%{opacity:0;transform:scale(2);}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 22px;border-radius:999px;display:none;z-index:12000;font-weight:700;white-space:nowrap;}
#capTimestamp{font-family:'Bebas Neue';font-size:1rem;color:var(--gold);letter-spacing:2px;opacity:.85;}
#bracketPopup{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:20000;padding:20px;}
.bracket-card{width:100%;max-width:1200px;max-height:90vh;overflow-y:auto;border-radius:28px;padding:24px;background:linear-gradient(180deg,rgba(18,18,18,.96),rgba(8,8,8,.98));border:1px solid rgba(245,197,24,.25);box-shadow:0 30px 80px rgba(0,0,0,.7);position:relative;}
.bracket-card::-webkit-scrollbar{width:6px;}.bracket-card::-webkit-scrollbar-track{background:transparent;}.bracket-card::-webkit-scrollbar-thumb{background:rgba(245,197,24,.3);border-radius:3px;}
.bracket-close{position:absolute;top:12px;right:16px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--text);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s ease;z-index:10;}
.bracket-close:hover{background:var(--red);border-color:var(--red);color:#fff;}
.bracket-title{font-family:'Bebas Neue';font-size:2rem;color:var(--gold);text-align:center;margin-bottom:18px;letter-spacing:3px;}
.bracket-btn{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,rgba(245,197,24,.15),rgba(245,197,24,.05));border:1px solid rgba(245,197,24,.3);backdrop-filter:blur(10px);font-family:'Bebas Neue';font-size:.9rem;letter-spacing:2px;color:var(--gold);cursor:pointer;transition:transform .2s ease,background .2s ease;white-space:nowrap;}
.bracket-btn:hover{transform:scale(1.05);background:linear-gradient(135deg,rgba(245,197,24,.25),rgba(245,197,24,.1));}

/* BRACKET STYLES */
.bracket-container{display:flex;gap:20px;justify-content:center;align-items:flex-start;overflow-x:auto;padding:10px 5px;}
.bracket-round{display:flex;flex-direction:column;gap:16px;min-width:180px;flex:1;}
.bracket-round-title{font-family:'Bebas Neue';text-align:center;color:var(--gold);font-size:1.1rem;letter-spacing:2px;margin-bottom:6px;border-bottom:1px solid rgba(245,197,24,.2);padding-bottom:4px;}
.bracket-match{position:relative;background:linear-gradient(180deg,rgba(30,30,30,.95),rgba(15,15,15,.98));border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s ease;}
.bracket-match:hover{border-color:rgba(245,197,24,.3);}
.bracket-team{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;font-size:.78rem;font-weight:600;}
.bracket-team.winner{background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.25);}
.bracket-team img{width:22px;height:14px;border-radius:3px;object-fit:cover;border:1px solid rgba(255,255,255,.15);}
.bracket-team span{flex:1;}
.bracket-team .bracket-score{font-family:'Bebas Neue';color:var(--gold);font-size:.9rem;min-width:20px;text-align:right;}
.bracket-date{text-align:center;font-size:.6rem;color:var(--muted);margin-top:2px;letter-spacing:1px;}
.bracket-connector{position:absolute;right:-20px;top:50%;width:20px;height:2px;background:rgba(245,197,24,.25);}
.bracket-connector::after{content:'';position:absolute;right:0;top:-24px;width:2px;height:50px;background:rgba(245,197,24,.25);}
.bracket-connector.alt::after{top:0;}
.bracket-round:last-child .bracket-connector{display:none;}
.bracket-final-trophy{text-align:center;font-size:2rem;margin-top:8px;filter:drop-shadow(0 0 10px rgba(245,197,24,.4));}

@media(max-width:820px){
  .matches{grid-template-columns:1fr;gap:12px;}
  .flag{width:48px;height:32px;}
  .score{width:52px;height:48px;font-size:1.5rem;}
  .team-name{font-size:.8rem;}
  .match-info{font-size:.7rem;}
  .bracket-container{flex-direction:column;align-items:center;}
  .bracket-round{min-width:260px;max-width:320px;width:100%;}
  .bracket-connector{display:none;}
}
@media(max-width:640px){
  .actions{grid-template-columns:repeat(2,minmax(0,1fr));}
  .wc-action{height:76px;padding:0 16px;gap:12px;}
  .wc-icon{width:48px;height:48px;min-width:48px;font-size:1.3rem;}
  .wc-btn-content span{font-size:.88rem;}
  .wc-btn-content small{font-size:.64rem;}
  .matches{gap:10px;}
  .match{padding:18px 14px 14px;gap:10px;}
  .flag{width:40px;height:26px;}
  .score{width:44px;height:40px;font-size:1.3rem;}
  .team-name{font-size:.72rem;}
  .match-info{font-size:.65rem;}
  .score-sep{font-size:1.6rem;}
  .bracket-title{font-size:1.5rem;}
  .banner-title{font-size:clamp(1.8rem,6vw,3rem);}
}
</style>
</head>
<body>
<div class="stadium-lights"><div class="reflector ref-1"></div><div class="reflector ref-2"></div><div class="reflector ref-3"></div><div class="reflector ref-4"></div></div>
<div id="flash-container"></div>
<audio id="fifaSound" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" type="audio/mpeg"></audio>
<audio id="stadiumIntro" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/209/209-preview.mp3" type="audio/mpeg"></audio>
<audio id="transitionSound" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2219/2219-preview.mp3" type="audio/mpeg"></audio>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="pitch-lines"></div>
    <div class="trophy-container">🏆</div>
    <div class="login-title">MUNDIAL 2026</div>
    <div class="login-sub">QUINIELA 8VOS DE FINAL</div>
    <input type="text" id="codeInput" class="login-input" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CÓDIGO">
    <div id="loginPreview"></div>
    <button class="wc-action save-btn" style="width:100%;justify-content:center;" onclick="doLogin()">
      <div class="wc-icon">🏟️</div>
      <div class="wc-btn-content"><span>ENTRA AL CAMPO</span><small>&nbsp;</small></div>
    </button>
  </div>
</div>

<div class="app" id="app" style="display:none;">
  <div class="main">
    <div class="fifa-banner">
      <div class="banner-particles"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="banner-glow"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;position:relative;z-index:2;">
        <div style="display:flex;align-items:center;gap:18px;">
          <div class="wc-logo-container"><div class="wc-pulse"></div><div class="wc-ball">⚽</div></div>
          <div>
            <div class="banner-title">FIFA WORLD CUP 2026</div>
            <div class="banner-subtitle">QUINIELA 8VOS DE FINAL</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <button class="bracket-btn" onclick="openBracketPopup()"><span>🏆</span>LLAVES</button>
          <div class="live-badge"><span class="live-dot"></span>8VOS DE FINAL</div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="wc-action save-btn" onclick="savePicks()"><div class="wc-icon">💾</div><div class="wc-btn-content"><span>GUARDAR</span><small>Guardar quiniela</small></div></button>
      <button class="wc-action export-btn" onclick="handleExport()"><div class="wc-icon">📸</div><div class="wc-btn-content"><span>EXPORTAR</span><small>Generar imagen</small></div></button>
      <button class="wc-action lock-btn" onclick="handleLock()"><div class="wc-icon">🔒</div><div class="wc-btn-content"><span>BLOQUEAR</span><small>Cerrar pronósticos</small></div></button>
      <button class="wc-action unlock-btn" onclick="handleUnlock()"><div class="wc-icon">🔓</div><div class="wc-btn-content"><span>MODIFICAR</span><small>Editar resultados</small></div></button>
    </div>

    <div class="status-bar">
      <div id="statusText">ESTADO: ABIERTO 🟢</div>
      <div id="counterText" style="font-family:'Bebas Neue';font-size:1.1rem;letter-spacing:2px;color:var(--muted);">0/8</div>
      <div id="displayUser" style="font-weight:800;color:var(--gold);"></div>
    </div>

    <div id="captureArea">
      <div id="captureHeader" style="display:none;margin-bottom:20px;padding-bottom:18px;border-bottom:2px solid rgba(255,255,255,.08);">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div style="font-family:'Bebas Neue';font-size:3rem;color:var(--gold);">FIFA WORLD CUP 2026</div>
            <div id="capStatus" style="font-family:'Bebas Neue';letter-spacing:3px;"></div>
            <div id="capUser" style="font-family:'Bebas Neue';font-size:1.8rem;margin-top:4px;"></div>
          </div>
          <div style="text-align:right;padding-top:6px;">
            <div style="font-family:'Bebas Neue';font-size:.85rem;color:var(--muted);letter-spacing:2px;">GENERADO</div>
            <div id="capTimestamp"></div>
            <div style="font-family:'Bebas Neue';font-size:.8rem;color:var(--muted);letter-spacing:2px;margin-top:4px;">PREDICCIONES</div>
            <div id="capCounter" style="font-family:'Bebas Neue';font-size:1.4rem;color:var(--gold);letter-spacing:3px;"></div>
          </div>
        </div>
      </div>
      <div class="matches" id="matchesContainer"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="masterModal">
  <div class="modal-card">
    <h3 id="mTitle" style="margin-bottom:10px;">ADMIN</h3>
    <p id="mDesc" style="font-size:.8rem;color:var(--muted);margin-bottom:18px;"></p>
    <input type="password" id="mInput" class="login-input" placeholder="••••" style="height:56px;letter-spacing:5px;">
    <div style="display:flex;gap:10px;margin-top:18px;">
      <button class="wc-action lock-btn" style="flex:1;height:50px;justify-content:center;" onclick="closeM()">CANCELAR</button>
      <button class="wc-action save-btn" style="flex:1;height:50px;justify-content:center;" onclick="confirmM()">OK</button>
    </div>
  </div>
</div>

<div id="goalOverlay">
  <div style="font-family:'Bebas Neue';font-size:10vw;color:var(--gold);text-shadow:0 0 40px var(--gold);animation:trophyMove .5s infinite alternate;">¡GOOOOOOOL!</div>
  <div style="font-family:'Bebas Neue';letter-spacing:5px;font-size:1.4rem;">GENERANDO EXPERIENCIA FIFA...</div>
</div>

<div id="bracketPopup">
  <div class="bracket-card">
    <button class="bracket-close" onclick="closeBracketPopup()">✕</button>
    <div class="bracket-title">🏆 LLAVES MUNDIAL 2026</div>
    <div class="bracket-container" id="bracketContainer"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const ADMIN_PASS = "AP420";
const USER_CODES = {"ADMIN0":"Administrador","JUDI97":"Juan de Dios","NDZA11":"Fernando Esparza","NNPR19":"Andrés Esparza","RRMO22":"Marco Moran","UARR92":"Saul Rdz","AAOT34":"古本 剛啓","ARKK33":"Eduardo Kiko","NNQE99":"Sandy Vazquez","EDDS40":"Eddy Esqueda","FFAE15":"Fer Bernal","UERO53":"Jesus Tiscareño","GTMT19":"Goyito Mtz","MABR63":"Ramon Bernal","LJCC73":"Julio César","DAPU34":"Alejandro Puga","IVMM57":"Victor M.","OSGG56":"Nestor G.","AACC63":"Juan Carlos","JIVO12":"Iván Trejo","JGMR16":"Jorge Moreno","HOSS30":"Joshua","DIOR76":"Ricardo Olvera","NESA26":"Wendy Casillas","VALD72":"Valeria de Luna","MMEE93":"Memo Gómez","LEIN58":"Fuera de Juego","CCOI79":"Carlos Molina","CHPR10":"Conchas Press","HNLI51":"Panchito Pillo","DCIG50":"Ricardo Rodriguez","DISS54":"Dania SV","GNMM49":"Angel M.","ANLE26":"Renata Lemos","IDNS59":"Dianita Serrano","OAJN35":"Joan","ANTO87":"Ana Ortíz","URPS41":"Uriel Esparza","MATE07":"Mateo Rdz","DRZG39":"Ricardo Zúñiga","IACC74":"Abuid Contreras"};

const FLAGS = {"México":"mx","Canadá":"ca","Brasil":"br","Australia":"au","Alemania":"de","Japón":"jp","Bélgica":"be","Cabo Verde":"cv","Suiza":"ch","Sudáfrica":"za","Estados Unidos":"us","Marruecos":"ma","Países Bajos":"nl","Costa de Marfil":"ci","España":"es","Egipto":"eg","Francia":"fr","Austria":"at","Colombia":"co","Croacia":"hr","Argentina":"ar","Noruega":"no","Inglaterra":"gb-eng","Portugal":"pt","R.D. Congo":"cd","Ghana":"gh","Panamá":"pa","Uzbekistán":"uz","Costa Rica":"cr","Irán":"ir","Corea del Sur":"kr","Senegal":"sn","Túnez":"tn","Qatar":"qa","Arabia Saudita":"sa","Irak":"iq","Jordania":"jo","Nueva Zelanda":"nz","Haití":"ht","Escocia":"gb-sct","Turquía":"tr","Paraguay":"py","Bosnia y Herz.":"ba","Rep. Checa":"cz","Suecia":"se","Ecuador":"ec","Curazao":"cw","Uruguay":"uy","Argelia":"dz"};

const MATCHES = [
  {h:"México",a:"Canadá",d:"Sáb 3 Jul · 11:00",s:"AT&T Stadium, Arlington · TX"},
  {h:"Brasil",a:"Australia",d:"Sáb 3 Jul · 15:00",s:"MetLife Stadium, East Rutherford · NY"},
  {h:"Alemania",a:"Japón",d:"Sáb 3 Jul · 19:00",s:"Estadio Azteca, Ciudad de México · MX"},
  {h:"Bélgica",a:"Cabo Verde",d:"Sáb 3 Jul · 21:00",s:"Mercedes-Benz Stadium, Atlanta · EU"},
  {h:"Suiza",a:"Sudáfrica",d:"Dom 4 Jul · 11:00",s:"Lumen Field, Seattle · EU"},
  {h:"Estados Unidos",a:"Marruecos",d:"Dom 4 Jul · 15:00",s:"Levi's Stadium, Santa Clara · EU"},
  {h:"Países Bajos",a:"Costa de Marfil",d:"Dom 4 Jul · 19:00",s:"SoFi Stadium, Inglewood · EU"},
  {h:"España",a:"Egipto",d:"Dom 4 Jul · 21:00",s:"BMO Field, Toronto · CA"}
];

const BRACKET_DATA = {
  octavos: [
    {h:"México", a:"Canadá", date:"Sáb 3 Jul", hScore:null, aScore:null},
    {h:"Brasil", a:"Australia", date:"Sáb 3 Jul", hScore:null, aScore:null},
    {h:"Alemania", a:"Japón", date:"Sáb 3 Jul", hScore:null, aScore:null},
    {h:"Bélgica", a:"Cabo Verde", date:"Sáb 3 Jul", hScore:null, aScore:null},
    {h:"Suiza", a:"Sudáfrica", date:"Dom 4 Jul", hScore:null, aScore:null},
    {h:"Estados Unidos", a:"Marruecos", date:"Dom 4 Jul", hScore:null, aScore:null},
    {h:"Países Bajos", a:"Costa de Marfil", date:"Dom 4 Jul", hScore:null, aScore:null},
    {h:"España", a:"Egipto", date:"Dom 4 Jul", hScore:null, aScore:null}
  ],
  cuartos: [
    {h:"Ganador O1", a:"Ganador O2", date:"7 Jul"},
    {h:"Ganador O3", a:"Ganador O4", date:"7 Jul"},
    {h:"Ganador O5", a:"Ganador O6", date:"8 Jul"},
    {h:"Ganador O7", a:"Ganador O8", date:"8 Jul"}
  ],
  semifinales: [
    {h:"Ganador C1", a:"Ganador C2", date:"11 Jul"},
    {h:"Ganador C3", a:"Ganador C4", date:"12 Jul"}
  ],
  final: [
    {h:"Ganador S1", a:"Ganador S2", date:"15 Jul"}
  ]
};

let currentUser = "", currentCode = "", locked = false, picks = {}, mCallback = null;

document.getElementById("codeInput").addEventListener("input", function(){
  const n = USER_CODES[this.value.toUpperCase()];
  document.getElementById("loginPreview").textContent = n ? "HOLA, " + n + "!" : "";
});

function doLogin(){
  const c = document.getElementById("codeInput").value.toUpperCase().trim();
  if(USER_CODES[c]){
    document.getElementById("stadiumIntro").play().catch(()=>{});
    setTimeout(()=>{document.getElementById("fifaSound").play().catch(()=>{});},400);
    currentUser = USER_CODES[c];
    currentCode = c;
    loadData();
    const login = document.getElementById("loginScreen");
    login.style.transition = ".7s cubic-bezier(.2,.8,.2,1)";
    login.style.opacity = "0";
    login.style.transform = "scale(1.08)";
    setTimeout(()=>{
      login.style.display = "none";
      document.getElementById("app").style.display = "block";
      document.getElementById("displayUser").textContent = currentUser;
      renderMatches();
      updateStatusUI();
    },650);
  } else {
    alert("CÓDIGO INVÁLIDO");
  }
}

function loadData(){
  picks = JSON.parse(localStorage.getItem("wc26_picks_r8_" + currentCode) || "{}");
  locked = localStorage.getItem("wc26_lock_r8_" + currentCode) === "1";
}

function renderMatches(){
  const mc = document.getElementById("matchesContainer");
  mc.innerHTML = MATCHES.map((m,idx)=>{
    const hV = picks[`r8_${idx}_h`] ?? "";
    const aV = picks[`r8_${idx}_a`] ?? "";
    const isFilled = hV !== "" && aV !== "";
    return `<div class="match ${isFilled ? 'filled' : ''}">
      <div class="match-teams">
        <div class="team">
          <img class="flag" src="https://flagcdn.com/w80/${FLAGS[m.h]||"un"}.png" alt="${m.h}">
          <span class="team-name">${m.h}</span>
          <input class="score" type="number" min="0" max="99" value="${hV}" ${locked?"disabled":""} oninput="updatePick(${idx},'h',this)">
        </div>
        <span class="score-sep">:</span>
        <div class="team">
          <img class="flag" src="https://flagcdn.com/w80/${FLAGS[m.a]||"un"}.png" alt="${m.a}">
          <span class="team-name">${m.a}</span>
          <input class="score" type="number" min="0" max="99" value="${aV}" ${locked?"disabled":""} oninput="updatePick(${idx},'a',this)">
        </div>
      </div>
      <div class="match-info">📅 ${m.d}<br>🏟 ${m.s}</div>
    </div>`;
  }).join("");
  updateCounter();
}

function updateCounter(){
  const total = MATCHES.length;
  const completed = MATCHES.filter((_,i)=>picks[`r8_${i}_h`]!==""&&picks[`r8_${i}_h`]!==undefined&&picks[`r8_${i}_a`]!==""&&picks[`r8_${i}_a`]!==undefined).length;
  const el = document.getElementById("counterText");
  if(el){
    el.textContent = `${completed}/${total}`;
    el.style.color = completed===total?"var(--gold)":"var(--muted)";
  }
}

function updatePick(idx,side,el){
  picks[`r8_${idx}_${side}`] = el.value.slice(0,2);
  el.closest(".match").classList.toggle("filled",picks[`r8_${idx}_h`]!==""&&picks[`r8_${idx}_h`]!==undefined&&picks[`r8_${idx}_a`]!==""&&picks[`r8_${idx}_a`]!==undefined);
  updateCounter();
}

function updateStatusUI(){
  const s = document.getElementById("statusText");
  s.innerHTML = locked?"ESTADO: CERRADO 🔒":"ESTADO: ABIERTO 🟢";
  s.style.color = locked?"var(--red)":"var(--green)";
}

function savePicks(){
  if(locked){toast("🔒 PRONÓSTICOS CERRADOS"); return;}
  localStorage.setItem("wc26_picks_r8_" + currentCode, JSON.stringify(picks));
  toast("💾 PRONÓSTICOS GUARDADOS");
}

function handleLock(){
  if(locked) return;
  if(confirm("¿BLOQUEAR PRONÓSTICOS?")){
    locked = true;
    localStorage.setItem("wc26_lock_r8_" + currentCode, "1");
    savePicks();
    renderMatches();
    updateStatusUI();
  }
}

function openM(title,desc,cb){
  document.getElementById("mTitle").textContent = title;
  document.getElementById("mDesc").textContent = desc;
  document.getElementById("mInput").value = "";
  document.getElementById("masterModal").style.display = "flex";
  mCallback = cb;
}

function closeM(){document.getElementById("masterModal").style.display = "none";}

function confirmM(){
  if(document.getElementById("mInput").value === ADMIN_PASS){
    closeM();
    if(mCallback) mCallback();
  } else {
    alert("CLAVE INCORRECTA");
  }
}

function handleUnlock(){
  openM("DESBLOQUEAR","Ingresa clave de administración", function(){
    locked = false;
    localStorage.setItem("wc26_lock_r8_" + currentCode, "0");
    renderMatches();
    updateStatusUI();
  });
}

function getTimestamp(){
  const now = new Date();
  const dias = ["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"];
  const meses = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
  return `${dias[now.getDay()]} ${String(now.getDate()).padStart(2,"0")} ${meses[now.getMonth()]} ${now.getFullYear()}  ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
}

function handleExport(){
  if(!locked){
    openM("EXPORTAR","Pronósticos ABIERTOS. Se requiere clave.", doExport);
  } else {
    doExport();
  }
}

function doExport(){
  document.getElementById("transitionSound").play().catch(()=>{});
  const flashes = document.getElementById("flash-container");
  flashes.style.display = "block";
  for(let i=0;i<28;i++){
    setTimeout(()=>{
      const b=document.createElement("div");
      b.className="camera-burst";
      b.style.top=Math.random()*100+"%";
      b.style.left=Math.random()*100+"%";
      flashes.appendChild(b);
      setTimeout(()=>b.remove(),300);
    },i*35);
  }
  setTimeout(()=>{
    const overlay=document.getElementById("goalOverlay");
    overlay.style.display="flex";
    setTimeout(()=>{
      const area=document.getElementById("captureArea");
      const header=document.getElementById("captureHeader");
      header.style.display="block";
      document.getElementById("capStatus").textContent=locked?"PRONÓSTICO CERRADO":"PRONÓSTICO ABIERTO";
      document.getElementById("capUser").textContent=currentUser;
      document.getElementById("capTimestamp").textContent=getTimestamp();
      const _total=MATCHES.length;
      const _done=MATCHES.filter((_,i)=>picks[`r8_${i}_h`]!==""&&picks[`r8_${i}_h`]!==undefined&&picks[`r8_${i}_a`]!==""&&picks[`r8_${i}_a`]!==undefined).length;
      document.getElementById("capCounter").textContent=`${_done}/${_total}`;
      const inputs=area.querySelectorAll("input");
      const backups=[];
      inputs.forEach(inp=>{
        const rep=document.createElement("div");
        rep.className=inp.className;
        rep.style.height="40px";
        rep.style.lineHeight="40px";
        rep.style.display="inline-block";
        rep.textContent=inp.value||"-";
        backups.push({orig:inp,rep});
        inp.style.display="none";
        inp.parentNode.insertBefore(rep,inp);
      });
      html2canvas(area,{scale:2,backgroundColor:"#090909",useCORS:true}).then(canvas=>{
        backups.forEach(b=>{
          b.rep.remove();
          b.orig.style.display="inline-block";
        });
        header.style.display="none";
        overlay.style.display="none";
        flashes.style.display="none";
        const link=document.createElement("a");
        link.download=`WC26_R16_${currentUser}.jpg`;
        link.href=canvas.toDataURL("image/jpeg",.95);
        link.click();
      });
    },1200);
  },350);
}

function openBracketPopup(){
  const container = document.getElementById("bracketContainer");
  container.innerHTML = "";
  
  // Octavos
  const round8 = document.createElement("div");
  round8.className = "bracket-round";
  round8.innerHTML = `<div class="bracket-round-title">OCTAVOS</div>` + 
    BRACKET_DATA.octavos.map((m,i) => {
      const hFlag = FLAGS[m.h] || "un";
      const aFlag = FLAGS[m.a] || "un";
      return `<div class="bracket-match">
        <div class="bracket-team"><img src="https://flagcdn.com/w40/${hFlag}.png"><span>${m.h}</span>${m.hScore!==null?`<span class="bracket-score">${m.hScore}</span>`:''}</div>
        <div class="bracket-team"><img src="https://flagcdn.com/w40/${aFlag}.png"><span>${m.a}</span>${m.aScore!==null?`<span class="bracket-score">${m.aScore}</span>`:''}</div>
        <div class="bracket-date">${m.date}</div>
      </div>`;
    }).join("");
  container.appendChild(round8);
  
  // Cuartos
  const round4 = document.createElement("div");
  round4.className = "bracket-round";
  round4.innerHTML = `<div class="bracket-round-title">CUARTOS</div>` + 
    BRACKET_DATA.cuartos.map(m => {
      return `<div class="bracket-match">
        <div class="bracket-team"><span style="opacity:.6;">${m.h}</span></div>
        <div class="bracket-team"><span style="opacity:.6;">${m.a}</span></div>
        <div class="bracket-date">${m.date}</div>
      </div>`;
    }).join("");
  container.appendChild(round4);
  
  // Semifinales
  const round2 = document.createElement("div");
  round2.className = "bracket-round";
  round2.innerHTML = `<div class="bracket-round-title">SEMIFINALES</div>` + 
    BRACKET_DATA.semifinales.map(m => {
      return `<div class="bracket-match">
        <div class="bracket-team"><span style="opacity:.6;">${m.h}</span></div>
        <div class="bracket-team"><span style="opacity:.6;">${m.a}</span></div>
        <div class="bracket-date">${m.date}</div>
      </div>`;
    }).join("");
  container.appendChild(round2);
  
  // Final
  const round1 = document.createElement("div");
  round1.className = "bracket-round";
  round1.innerHTML = `<div class="bracket-round-title">GRAN FINAL</div>` + 
    BRACKET_DATA.final.map(m => {
      return `<div class="bracket-match">
        <div class="bracket-team"><span style="opacity:.6;">${m.h}</span></div>
        <div class="bracket-team"><span style="opacity:.6;">${m.a}</span></div>
        <div class="bracket-date">${m.date}</div>
        <div class="bracket-final-trophy">🏆</div>
      </div>`;
    }).join("");
  container.appendChild(round1);
  
  document.getElementById("bracketPopup").style.display = "flex";
}

function closeBracketPopup(){
  document.getElementById("bracketPopup").style.display = "none";
}

document.getElementById("bracketPopup").addEventListener("click",function(e){
  if(e.target===this) closeBracketPopup();
});

function toast(m){
  const t=document.getElementById("toast");
  t.textContent=m;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2500);
}
</script>
