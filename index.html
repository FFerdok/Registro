<!-- ============================= -->

<style>

/* =========================================================
   BANNER PREMIUM MUNDIALISTA
========================================================= */

.fifa-banner{

  position:relative;
  overflow:hidden;

  padding:30px;

  border-radius:34px;

  margin-bottom:22px;

  border:1px solid rgba(255,255,255,.08);

  background:
  linear-gradient(
  135deg,
  rgba(8,8,8,.95),
  rgba(18,18,18,.97)
  );

  backdrop-filter:blur(16px);

  box-shadow:
  0 20px 60px rgba(0,0,0,.45),
  inset 0 1px 0 rgba(255,255,255,.06);

}

/* GLOW */

.banner-glow{

  position:absolute;

  width:400px;
  height:400px;

  background:
  radial-gradient(circle,
  rgba(245,197,24,.22),
  transparent 70%);

  top:-150px;
  right:-100px;

  filter:blur(40px);

  animation:glowMove 8s infinite alternate ease-in-out;

}

@keyframes glowMove{

  from{
    transform:translateY(0) scale(1);
  }

  to{
    transform:translateY(40px) scale(1.2);
  }

}

/* PARTICULAS */

.banner-particles{

  position:absolute;
  inset:0;

  overflow:hidden;

  pointer-events:none;

}

.banner-particles span{

  position:absolute;

  width:8px;
  height:8px;

  border-radius:50%;

  background:rgba(245,197,24,.8);

  box-shadow:
  0 0 12px rgba(245,197,24,.9);

  animation:floatParticle linear infinite;

}

.banner-particles span:nth-child(1){

  left:10%;
  top:80%;

  animation-duration:8s;

}

.banner-particles span:nth-child(2){

  left:30%;
  top:90%;

  animation-duration:11s;

}

.banner-particles span:nth-child(3){

  left:55%;
  top:100%;

  animation-duration:9s;

}

.banner-particles span:nth-child(4){

  left:75%;
  top:85%;

  animation-duration:13s;

}

.banner-particles span:nth-child(5){

  left:92%;
  top:95%;

  animation-duration:10s;

}

@keyframes floatParticle{

  from{

    transform:
    translateY(0)
    scale(.7);

    opacity:0;

  }

  20%{
    opacity:1;
  }

  to{

    transform:
    translateY(-220px)
    scale(1.2);

    opacity:0;

  }

}

/* LOGO */

.wc-logo-container{

  position:relative;

  width:90px;
  height:90px;

  display:flex;
  align-items:center;
  justify-content:center;

}

.wc-pulse{

  position:absolute;

  inset:0;

  border-radius:50%;

  border:2px solid rgba(245,197,24,.5);

  animation:pulseRing 2.6s infinite;

}

@keyframes pulseRing{

  0%{

    transform:scale(.8);
    opacity:1;

  }

  100%{

    transform:scale(1.5);
    opacity:0;

  }

}

.wc-ball{

  width:78px;
  height:78px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:2.5rem;

  background:
  linear-gradient(
  135deg,
  rgba(245,197,24,.2),
  rgba(255,255,255,.06)
  );

  border:1px solid rgba(255,255,255,.1);

  backdrop-filter:blur(10px);

  box-shadow:
  0 10px 30px rgba(245,197,24,.2);

  animation:ballFloat 4s infinite ease-in-out;

}

@keyframes ballFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-8px);
  }

}

/* TITULOS */

.banner-title{

  font-family:'Bebas Neue';

  font-size:clamp(2.5rem,7vw,5rem);

  letter-spacing:2px;

  line-height:1;

  text-shadow:
  0 0 20px rgba(255,255,255,.08);

}

.banner-subtitle{

  font-family:'Bebas Neue';

  color:var(--gold);

  font-size:1.6rem;

  letter-spacing:8px;

  margin-top:4px;

  text-shadow:
  0 0 16px rgba(245,197,24,.4);

}

/* BADGE */

.live-badge{

  display:flex;
  align-items:center;
  gap:10px;

  padding:14px 22px;

  border-radius:999px;

  background:
  linear-gradient(
  135deg,
  rgba(255,255,255,.06),
  rgba(255,255,255,.02)
  );

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(10px);

  font-family:'Bebas Neue';

  letter-spacing:3px;

  font-size:1rem;

}

.live-dot{

  width:12px;
  height:12px;

  border-radius:50%;

  background:#22c55e;

  box-shadow:
  0 0 18px #22c55e;

  animation:liveBlink 1s infinite;

}

@keyframes liveBlink{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.35;
  }

}

/* =========================================================
   BOTONES PREMIUM FIFA
========================================================= */

.actions{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(230px,1fr));

  gap:16px;

  margin-bottom:22px;

}

.wc-action{

  position:relative;
  overflow:hidden;

  height:88px;

  border:none;

  border-radius:28px;

  cursor:pointer;

  display:flex;
  align-items:center;

  gap:18px;

  padding:0 22px;

  color:#fff;

  transition:
  transform .25s ease,
  box-shadow .25s ease;

  backdrop-filter:blur(14px);

  box-shadow:
  0 16px 35px rgba(0,0,0,.32);

}

.wc-action:hover{

  transform:
  translateY(-4px)
  scale(1.02);

}

.wc-action::before{

  content:'';

  position:absolute;
  inset:0;

  background:
  linear-gradient(
  135deg,
  rgba(255,255,255,.16),
  transparent 60%
  );

}

.wc-action::after{

  content:'';

  position:absolute;

  width:180px;
  height:180px;

  background:
  radial-gradient(circle,
  rgba(255,255,255,.18),
  transparent 70%);

  right:-80px;
  top:-80px;

  transition:.35s ease;

}

.wc-action:hover::after{

  transform:scale(1.25);

}

/* ICONO */

.wc-icon{

  min-width:56px;
  width:56px;
  height:56px;

  border-radius:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:1.6rem;

  background:
  rgba(255,255,255,.14);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(10px);

}

/* TEXTO */

.wc-btn-content{

  display:flex;
  flex-direction:column;
  align-items:flex-start;

  position:relative;
  z-index:2;

}

.wc-btn-content span{

  font-weight:800;

  font-size:1rem;

  letter-spacing:.5px;

}

.wc-btn-content small{

  opacity:.75;

  font-size:.72rem;

  margin-top:2px;

}

/* COLORES */

.save-btn{

  background:
  linear-gradient(
  135deg,
  #f5c518,
  #c9900a
  );

}

.export-btn{

  background:
  linear-gradient(
  135deg,
  #16a34a,
  #0f7a35
  );

}

.lock-btn{

  background:
  linear-gradient(
  135deg,
  #dc2626,
  #991b1b
  );

}

.unlock-btn{

  background:
  linear-gradient(
  135deg,
  #2563eb,
  #1d4ed8
  );

}

/* =========================================================
   AMBIENTE PREMIUM
========================================================= */

body::after{

  content:'';

  position:fixed;
  inset:0;

  background:
  radial-gradient(circle at top,
  rgba(245,197,24,.08),
  transparent 35%);

  pointer-events:none;

  z-index:-1;

  animation:ambientMove 10s infinite alternate ease-in-out;

}

@keyframes ambientMove{

  from{
    opacity:.6;
    transform:translateY(0);
  }

  to{
    opacity:1;
    transform:translateY(20px);
  }

}

/* =========================================================
   MATCHES MÁS PREMIUM
========================================================= */

.match{

  background:
  linear-gradient(
  180deg,
  rgba(22,22,22,.96),
  rgba(10,10,10,.98)
  );

  border:1px solid rgba(255,255,255,.08);

  box-shadow:
  0 16px 30px rgba(0,0,0,.28);

  transition:
  transform .25s ease,
  border-color .25s ease;

}

.match:hover{

  transform:
  translateY(-3px);

  border-color:
  rgba(245,197,24,.28);

}

.match::after{

  content:'';

  position:absolute;

  inset:0;

  background:
  linear-gradient(
  135deg,
  rgba(255,255,255,.05),
  transparent 60%
  );

  pointer-events:none;

}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:640px){

  .wc-action{

    height:76px;

    padding:0 16px;

    gap:12px;

  }

  .wc-icon{

    width:48px;
    height:48px;
    min-width:48px;

    font-size:1.3rem;

  }

  .wc-btn-content span{

    font-size:.88rem;

  }

  .wc-btn-content small{

    font-size:.64rem;

  }

}

</style>
