<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<title>Mundial 2026 - Estadio Virtual</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
:root {
  --gold: #f5c518;
  --gold2: #c9900a;
  --red: #c0392b;
  --green: #27ae60;
  --bg: #121212;
  --mid: #1a1a1a;
  --card: #1e1e1e;
  --border: #333333;
  --text: #e8eaf0;
  --muted: #888888;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Exo 2', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* ── LUCES DE ESTADIO (VISIBLES) ── */
.stadium-fx {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
}
.light-beam {
  position: absolute; width: 100vw; height: 100vh;
  background: radial-gradient(circle at 50% -20%, rgba(255,255,255,0.08) 0%, transparent 60%);
  animation: lightSweep 8s infinite alternate ease-in-out;
}
@keyframes lightSweep {
  0% { transform: translateX(-20%) skewX(-15deg); opacity: 0.3; }
  100% { transform: translateX(20%) skewX(15deg); opacity: 0.7; }
}

/* ── FLASH DE CÁMARA (MULTIPLE) ── */
#flash-container {
  position: fixed; inset: 0; z-index: 10000; pointer-events: none; display: none;
}
.camera-burst {
  position: absolute; width: 150px; height: 150px;
  background: white; border-radius: 50%; filter: blur(50px);
  opacity: 0; animation: burstAnim 0.3s ease-out forwards;
}
@keyframes burstAnim {
  0% { opacity: 0; transform: scale(0.2); }
  50% { opacity: 1; transform: scale(1.5); }
  100% { opacity: 0; transform: scale(2); }
}

/* ── BANNER ── */
.fifa-banner {
  background: linear-gradient(135deg, #000, #222);
  border: 1px solid var(--border); border-radius: 24px; padding: 30px;
  text-align: center; position: relative; overflow: hidden; margin-bottom: 25px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.5);
}
.fifa-banner::after {
  content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  transform: skewX(-30deg); animation: shimmer 5s infinite;
}
@keyframes shimmer { 0% { left: -100%; } 30% { left: 150%; } 100% { left: 150%; } }

/* ── GRID FORZADO DOBLE COLUMNA ── */
.matches { 
  display: grid; 
  grid-template-columns: 1fr 1fr; /* Siempre 2 columnas */
  gap: 10px; 
}

.match { 
  background: var(--card); border: 1px solid var(--border); border-radius: 15px; 
  padding: 12px; position: relative; overflow: hidden; 
  animation: slideIn 0.6s cubic-bezier(0.23, 1, 0.32, 1) both;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

.match::before { 
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; 
  background: var(--gold); opacity: 0.1;
}
.match.filled::before { opacity: 1; box-shadow: 0 0 10px var(--gold); }

.match-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 5px; }
.team { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; font-size: 0.7rem; text-align: center; }
.flag { width: 28px; height: 18px; border-radius: 3px; object-fit: cover; border: 1px solid #333; }

.score { 
  width: 40px; height: 40px; line-height: 40px; background: var(--mid); 
  border: 2px solid var(--border); border-radius: 10px; color: var(--gold); 
  font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; text-align: center; outline: none;
}

/* ── MODALES CUSTOM ── */
.modal-overlay { 
  position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 5000;
  display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px);
}
.modal-card { 
  background: var(--card); border: 1px solid var(--border); border-radius: 24px; 
  padding: 30px; width: 90%; max-width: 320px; text-align: center;
}

/* ── OVERLAY GOL ── */
#goalOverlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999;
  display: none; align-items: center; justify-content: center; flex-direction: column;
}
.goal-text { 
  font-family: 'Bebas Neue', sans-serif; font-size: 12vw; color: var(--gold); 
  text-shadow: 0 0 50px var(--gold); animation: goalAnim 0.4s infinite alternate;
}
@keyframes goalAnim { from { transform: scale(1); } to { transform: scale(1.15); } }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.action-btn { height: 48px; border: none; border-radius: 12px; font-family: 'Bebas Neue', sans-serif; font-size: 1rem; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; gap: 5px; }
</style>
</head>
<body>

<div class="stadium-fx">
    <div class="light-beam"></div>
</div>

<div id="flash-container"></div>

<audio id="fifaSound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" type="audio/mpeg">
</audio>

<div id="goalOverlay">
    <div class="goal-text">¡GOOOOOOOOL!</div>
    <p style="font-family: 'Bebas Neue'; color: #fff; font-size: 1.2rem; letter-spacing: 4px;">FOTOGRAFIANDO ESTADIO...</p>
</div>

<div class="login-screen" id="loginScreen">
  <div class="modal-card">
    <div style="font-size: 3rem; margin-bottom: 10px;">🏆</div>
    <h1 style="font-family: 'Bebas Neue'; color: var(--gold); font-size: 2.2rem;">MUNDIAL 2026</h1>
    <p style="color: var(--muted); font-size: 0.75rem; margin-bottom: 20px;">PREDICTOR OFICIAL</p>
    <input type="text" id="codeInput" class="score" style="width:100%; height:55px; letter-spacing:8px; margin-bottom:15px;" maxlength="6" placeholder="CÓDIGO">
    <div id="loginPreview" style="color: var(--gold); font-weight: 700; margin-bottom: 15px; height: 20px;"></div>
    <button class="action-btn" style="background:var(--gold); color:#000; width:100%;" onclick="doLogin()">INGRESAR AL CAMPO</button>
  </div>
</div>

<div class="app" id="app" style="display:none;">
  <div class="main" style="max-width: 1200px; margin: auto; padding: 12px; position: relative; z-index: 10;">
    
    <div class="fifa-banner">
      <div style="font-family: 'Bebas Neue'; font-size: 3.2rem; color: #fff; line-height: 1;">MUNDIAL 2026</div>
      <p style="color: var(--gold); font-family: 'Bebas Neue'; font-size: 1.2rem; letter-spacing: 4px;">JORNADA 1 • EN VIVO</p>
    </div>

    <div class="actions">
      <button class="action-btn" style="background:var(--gold); color:#000" onclick="savePicks()">💾 GUARDAR</button>
      <button class="action-btn" style="background:var(--green)" onclick="handleExport()">📸 EXPORTAR</button>
      <button class="action-btn" style="background:var(--red)" onclick="handleLock()">🔒 BLOQUEAR</button>
      <button class="action-btn" style="background:#4b5563" onclick="handleUnlock()">🔓 DESBLOQUEAR</button>
    </div>

    <div style="background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; font-size: 0.75rem;">
      <div id="statusText">ESTADO: ABIERTO 🟢</div>
      <div id="displayUser" style="font-weight: 700; color: var(--gold);"></div>
    </div>

    <div id="captureArea" style="padding: 10px; background: var(--bg);">
       <div id="captureHeader" style="display:none; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px;">
           <div style="display: flex; justify-content: space-between; align-items: center;">
             <div>
               <div style="font-family:'Bebas Neue'; color: var(--gold); font-size: 2.2rem; line-height: 1;">FIFA WORLD CUP 2026</div>
               <div id="capStatus" style="font-family: 'Bebas Neue'; color:#fff; font-size: 1rem;">-</div>
             </div>
             <div style="text-align: right;">
               <div id="capUser" style="color:#fff; font-size: 1.2rem; font-family: 'Bebas Neue';"></div>
             </div>
           </div>
       </div>
       <div class="matches" id="matchesContainer"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="masterModal">
  <div class="modal-card">
    <h3 id="mTitle">ACCESO ADMIN</h3>
    <p id="mDesc" style="font-size: 0.8rem; color: var(--muted); margin-bottom: 20px;">Introduce la clave maestra</p>
    <input type="password" id="mInput" class="score" style="width:100%; height:50px;" placeholder="••••">
    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <button class="action-btn" style="background:#4b5563; flex:1" onclick="closeM()">CANCELAR</button>
      <button class="action-btn" style="background:var(--gold); color:#000; flex:1" onclick="confirmM()">OK</button>
    </div>
  </div>
</div>

<div id="toast" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--green); color:#fff; padding:10px 20px; border-radius:50px; display:none; z-index:6000;"></div>

<script>
const ADMIN_PASS = "AP420";
const USER_CODES = { "JDQM26": "Juan de Dios", "AEQM26": "Andrés Esparza", "FEQM26": "Fernando Esparza", "ADMIN0": "Administrador" };

const FLAGS = {
  "México": "mx", "Sudáfrica": "za", "Corea del Sur": "kr", "Rep. Checa": "cz",
  "Canadá": "ca", "Bosnia y Herz.": "ba", "Estados Unidos": "us", "Paraguay": "py",
  "Qatar": "qa", "Suiza": "ch", "Brasil": "br", "Marruecos": "ma",
  "Haití": "ht", "Escocia": "gb-sct", "Australia": "au", "Turquía": "tr",
  "Alemania": "de", "Curazao": "cw", "Países Bajos": "nl", "Japón": "jp",
  "Costa de Marfil": "ci", "Ecuador": "ec", "Suecia": "se", "Túnez": "tn",
  "España": "es", "Cabo Verde": "cv", "Bélgica": "be", "Egipto": "eg",
  "Arabia Saudita": "sa", "Uruguay": "uy", "Irán": "ir", "Nueva Zelanda": "nz",
  "Francia": "fr", "Senegal": "sn", "Argentina": "ar", "Argelia": "dz",
  "Irak": "iq", "Noruega": "no", "Austria": "at", "Jordania": "jo",
  "Portugal": "pt", "RD Congo": "cd", "Ghana": "gh", "Panamá": "pa",
  "Inglaterra": "gb-eng", "Croacia": "hr", "Uzbekistán": "uz", "Colombia": "co"
};

const MATCHES = [
  {h:"México",a:"Sudáfrica",d:"11 Jun · 13:00",s:"Estadio Azteca"},
  {h:"Corea del Sur",a:"Rep. Checa",d:"11 Jun · 20:00",s:"Estadio Akron"},
  {h:"Canadá",a:"Bosnia y Herz.",d:"12 Jun · 13:00",s:"Toronto Stadium"},
  {h:"Estados Unidos",a:"Paraguay",d:"12 Jun · 19:00",s:"SoFi Stadium"},
  {h:"Qatar",a:"Suiza",d:"13 Jun · 13:00",s:"Bay Area Stadium"},
  {h:"Brasil",a:"Marruecos",d:"13 Jun · 16:00",s:"MetLife Stadium"},
  {h:"Haití",a:"Escocia",d:"13 Jun · 19:00",s:"Gillette Stadium"},
  {h:"Australia",a:"Turquía",d:"13 Jun · 22:00",s:"BC Place"},
  {h:"Alemania",a:"Curazao",d:"14 Jun · 11:00",s:"NRG Stadium"},
  {h:"Países Bajos",a:"Japón",d:"14 Jun · 14:00",s:"AT&T Stadium"},
  {h:"Costa de Marfil",a:"Ecuador",d:"14 Jun · 17:00",s:"Lincoln Financial"},
  {h:"Suecia",a:"Túnez",d:"14 Jun · 20:00",s:"Estadio BBVA"},
  {h:"España",a:"Cabo Verde",d:"15 Jun · 10:00",s:"Mercedes-Benz Stadium"},
  {h:"Bélgica",a:"Egipto",d:"15 Jun · 13:00",s:"Lumen Field"},
  {h:"Arabia Saudita",a:"Uruguay",d:"15 Jun · 16:00",s:"Hard Rock Stadium"},
  {h:"Irán",a:"Nueva Zelanda",d:"15 Jun · 19:00",s:"SoFi Stadium"},
  {h:"Francia",a:"Senegal",d:"16 Jun · 13:00",s:"MetLife Stadium"},
  {h:"Argentina",a:"Argelia",d:"16 Jun · 16:00",s:"Arrowhead Stadium"},
  {h:"Irak",a:"Noruega",d:"16 Jun · 19:00",s:"Gillette Stadium"},
  {h:"Austria",a:"Jordania",d:"16 Jun · 19:00",s:"Bay Area Stadium"},
  {h:"Portugal",a:"RD Congo",d:"17 Jun · 11:00",s:"NRG Stadium"},
  {h:"Ghana",a:"Panamá",d:"17 Jun · 13:00",s:"Toronto Stadium"},
  {h:"Inglaterra",a:"Croacia",d:"17 Jun · 14:00",s:"AT&T Stadium"},
  {h:"Uzbekistán",a:"Colombia",d:"17 Jun · 19:00",s:"Estadio Azteca"}
];

let currentUser = "", currentCode = "", locked = false, picks = {}, mCallback = null;

document.getElementById('codeInput').addEventListener('input', function() {
    let n = USER_CODES[this.value.toUpperCase()];
    document.getElementById('loginPreview').textContent = n ? "HOLA, " + n + "!" : "";
});

function doLogin(){
  let c = document.getElementById("codeInput").value.toUpperCase();
  if(USER_CODES[c]){
    document.getElementById('fifaSound').play().catch(e => {});
    currentUser = USER_CODES[c]; currentCode = c;
    loadData(); showApp();
  } else { alert("CÓDIGO INVÁLIDO"); }
}

function loadData(){
  picks = JSON.parse(localStorage.getItem("wc26_picks_" + currentCode) || "{}");
  locked = localStorage.getItem("wc26_lock_" + currentCode) === "1";
}

function showApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("displayUser").textContent = currentUser;
  renderMatches();
  updateStatusUI();
}

function renderMatches(){
  const mc = document.getElementById("matchesContainer");
  mc.innerHTML = MATCHES.map((m, idx) => {
    const hV = picks[`j1_${idx}_h`] || ""; const aV = picks[`j1_${idx}_a`] || "";
    return `
      <div class="match ${hV !== '' && aV !== '' ? 'filled' : ''}" style="animation-delay: ${idx * 0.05}s">
        <div class="match-top">
          <div class="team">
            <img class="flag" src="https://flagcdn.com/w80/${FLAGS[m.h] || "un"}.png">
            <span>${m.h}</span>
          </div>
          <div style="display:flex; align-items:center; gap:5px;">
            <input class="score" type="number" value="${hV}" ${locked?'disabled':''} oninput="updatePick(${idx},'h',this)">
            <span style="color:var(--gold); font-family:'Bebas Neue'">:</span>
            <input class="score" type="number" value="${aV}" ${locked?'disabled':''} oninput="updatePick(${idx},'a',this)">
          </div>
          <div class="team">
            <img class="flag" src="https://flagcdn.com/w80/${FLAGS[m.a] || "un"}.png">
            <span>${m.a}</span>
          </div>
        </div>
        <div style="margin-top:8px; font-size:0.5rem; color:var(--muted); text-align:center;">${m.d}</div>
      </div>
    `;
  }).join('');
}

function updatePick(idx, side, el){
  picks[`j1_${idx}_${side}`] = el.value.slice(0,2);
  el.closest(".match").classList.toggle("filled", (picks[`j1_${idx}_h`] && picks[`j1_${idx}_a`]));
}

function updateStatusUI(){
  document.getElementById("statusText").innerHTML = locked ? "ESTADO: CERRADO 🔒" : "ESTADO: ABIERTO 🟢";
  document.getElementById("statusText").style.color = locked ? "var(--red)" : "var(--green)";
}

function savePicks(){
  if(locked) return toast("🔒 PRONÓSTICOS CERRADOS");
  localStorage.setItem("wc26_picks_" + currentCode, JSON.stringify(picks));
  toast("💾 GUARDADO");
}

function handleLock(){
  if(locked) return;
  if(confirm("¿BLOQUEAR PRONÓSTICOS?")) {
    locked = true; localStorage.setItem("wc26_lock_" + currentCode, "1");
    savePicks(); renderMatches(); updateStatusUI();
  }
}

function openM(title, desc, cb) {
    document.getElementById("mTitle").textContent = title;
    document.getElementById("mDesc").textContent = desc;
    document.getElementById("mInput").value = "";
    document.getElementById("masterModal").style.display = "flex";
    mCallback = cb;
}
function closeM() { document.getElementById("masterModal").style.display = "none"; }
function confirmM() {
    if(document.getElementById("mInput").value === ADMIN_PASS) {
        closeM(); if(mCallback) mCallback();
    } else { alert("CLAVE INCORRECTA"); }
}

function handleUnlock(){
    openM("DESBLOQUEAR", "Ingresa clave de administración", function() {
        locked = false; localStorage.setItem("wc26_lock_" + currentCode, "0");
        renderMatches(); updateStatusUI();
    });
}

function handleExport(){
  if(!locked){
    openM("EXPORTAR", "Registro ABIERTO. Se requiere clave para generar imagen.", doExport);
  } else {
    doExport();
  }
}

function doExport(){
  const fContainer = document.getElementById("flash-container");
  fContainer.style.display = "block";
  
  // RÁFAGA DE FLASHES
  for(let i=0; i<20; i++){
    setTimeout(() => {
        const b = document.createElement("div");
        b.className = "camera-burst";
        b.style.top = Math.random() * 100 + "%";
        b.style.left = Math.random() * 100 + "%";
        fContainer.appendChild(b);
        setTimeout(() => b.remove(), 300);
    }, i * 50);
  }

  setTimeout(() => {
    const overlay = document.getElementById("goalOverlay");
    overlay.style.display = "flex";
    
    setTimeout(() => {
        const area = document.getElementById("captureArea");
        const header = document.getElementById("captureHeader");
        header.style.display = "block";
        document.getElementById("capStatus").textContent = locked ? "PRONÓSTICO CERRADO" : "PRONÓSTICO ABIERTO";
        document.getElementById("capUser").textContent = currentUser;

        // FORZAR VISIBILIDAD PARA CAPTURA (Solución error animación)
        const allMatches = area.querySelectorAll('.match');
        allMatches.forEach(m => {
            m.style.opacity = "1";
            m.style.transform = "none";
            m.style.animation = "none";
        });

        const inputs = area.querySelectorAll("input");
        const backups = [];
        inputs.forEach(inp => {
          const rep = document.createElement("div");
          rep.className = inp.className;
          rep.style.height = "40px"; rep.style.lineHeight = "40px";
          rep.style.display = "inline-block"; rep.style.textAlign = "center";
          rep.textContent = inp.value || "-";
          backups.push({orig: inp, rep: rep});
          inp.style.display = "none";
          inp.parentNode.insertBefore(rep, inp);
        });

        html2canvas(area, { scale: 2, backgroundColor: "#121212", useCORS: true }).then(canvas => {
            backups.forEach(b => { b.rep.remove(); b.orig.style.display = "inline-block"; });
            header.style.display = "none";
            overlay.style.display = "none";
            fContainer.style.display = "none";
            renderMatches(); // Restaurar estado visual
            const link = document.createElement("a");
            link.download = `WC26_${currentUser}.jpg`;
            link.href = canvas.toDataURL("image/jpeg", 0.9);
            link.click();
        });
    }, 1200);
  }, 500);
}

function toast(m){
  const t = document.getElementById("toast"); t.textContent = m;
  t.style.display = "block"; setTimeout(()=>t.style.display="none", 2500);
}
</script>
</body>
</html>
