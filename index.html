<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212" id="themeMeta">

<title>Mundial 2026 - Predictor Pro X</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

:root{
  --gold:#f5c518;
  --gold2:#c9900a;
  --green:#22c55e;
  --red:#ef4444;

  --bg:#0f0f10;
  --card:#1a1a1d;
  --card2:#222226;
  --mid:#171717;

  --text:#f4f4f5;
  --muted:#a1a1aa;
  --border:#34343a;
}

body.light{
  --bg:#f4f6fa;
  --card:#ffffff;
  --card2:#f7f8fb;
  --mid:#ffffff;

  --text:#121212;
  --muted:#6b7280;
  --border:#dfe3ea;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  font-family:'Exo 2',sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  min-height:100vh;
  transition:.35s ease;
}

/* =========================
   ATMOSFERA FIFA
========================= */

.stadium-lights{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:0;
  pointer-events:none;
}

.reflector{
  position:absolute;
  width:700px;
  height:700px;
  border-radius:50%;
  filter:blur(100px);

  background:
  radial-gradient(circle,
  rgba(255,255,255,.08),
  transparent 70%);

  animation:moveLight 18s infinite alternate ease-in-out;
}

.ref-1{top:-20%;left:-10%;}
.ref-2{bottom:-20%;right:-10%;animation-duration:22s;}
.ref-3{top:20%;right:-20%;animation-duration:16s;}
.ref-4{bottom:10%;left:-20%;animation-duration:25s;}

@keyframes moveLight{
  0%{transform:translate(0,0) scale(1);}
  100%{transform:translate(120px,80px) scale(1.25);}
}

/* =========================
   INTRO CINEMATICA
========================= */

#cinematicIntro{
  position:fixed;
  inset:0;
  background:#000;
  z-index:99999;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  transition:1s ease;
}

.intro-logo{
  font-family:'Bebas Neue';
  font-size:min(14vw,8rem);
  color:#fff;
  letter-spacing:8px;

  text-shadow:
  0 0 25px var(--gold),
  0 0 60px var(--gold);

  animation:introPulse 2s infinite alternate;
}

.intro-sub{
  color:var(--gold);
  letter-spacing:6px;
  margin-top:10px;
}

@keyframes introPulse{
  from{
    transform:scale(1);
    opacity:.8;
  }
  to{
    transform:scale(1.06);
    opacity:1;
  }
}

/* =========================
   LOGIN
========================= */

.login-screen{
  position:fixed;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
  z-index:100;
}

.login-card{
  width:100%;
  max-width:380px;

  background:rgba(20,20,20,.92);

  border:1px solid rgba(255,255,255,.08);

  border-radius:32px;

  padding:40px;

  backdrop-filter:blur(16px);

  box-shadow:
  0 20px 60px rgba(0,0,0,.6);

  animation:slideUp .8s cubic-bezier(.2,.8,.2,1);
}

body.light .login-card{
  background:rgba(255,255,255,.92);
}

@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(50px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.trophy-container{
  font-size:5rem;
  text-align:center;
  margin-bottom:15px;

  filter:drop-shadow(0 0 25px var(--gold));

  animation:trophyFloat 4s infinite ease-in-out;
}

@keyframes trophyFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-12px);
  }
}

/* =========================
   APP
========================= */

.app{
  position:relative;
  z-index:10;
}

.main{
  max-width:1400px;
  margin:auto;
  padding:16px;
}

/* =========================
   BANNER
========================= */

.fifa-banner{
  position:relative;
  overflow:hidden;

  border-radius:28px;

  padding:34px;

  margin-bottom:20px;

  background:
  linear-gradient(
    135deg,
    #000,
    #18181b,
    #262626
  );

  border:1px solid rgba(255,255,255,.06);

  box-shadow:
  0 20px 50px rgba(0,0,0,.35);
}

body.light .fifa-banner{
  background:
  linear-gradient(
    135deg,
    #ffffff,
    #f5f5f5,
    #eef1f6
  );
}

.fifa-banner::before{
  content:'';
  position:absolute;

  top:0;
  left:-120%;

  width:60%;
  height:100%;

  background:
  linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.15),
    transparent
  );

  transform:skewX(-25deg);

  animation:shimmer 5s infinite;
}

@keyframes shimmer{
  0%{left:-120%;}
  35%{left:150%;}
  100%{left:150%;}
}

/* =========================
   BOTONES NUEVOS
========================= */

.actions{
  display:flex;
  gap:12px;
  margin-bottom:20px;

  overflow-x:auto;
  padding-bottom:4px;

  scrollbar-width:none;
}

.actions::-webkit-scrollbar{
  display:none;
}

.action-btn{
  min-width:135px;
  height:56px;

  border:none;
  border-radius:18px;

  padding:0 18px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  cursor:pointer;

  font-size:.88rem;
  font-weight:800;

  position:relative;
  overflow:hidden;

  transition:
  transform .22s ease,
  box-shadow .22s ease;

  box-shadow:
  0 10px 24px rgba(0,0,0,.25),
  inset 0 1px 0 rgba(255,255,255,.12);

  color:#fff;
}

.action-btn::before{
  content:'';

  position:absolute;
  inset:0;

  background:
  linear-gradient(
    135deg,
    rgba(255,255,255,.15),
    transparent 60%
  );
}

.action-btn:hover{
  transform:translateY(-2px);
}

.action-btn:active{
  transform:scale(.97);
}

.action-btn span{
  font-size:1.15rem;
}

.btn-save{
  background:linear-gradient(135deg,#f5c518,#d69d00);
  color:#000;
}

.btn-export{
  background:linear-gradient(135deg,#22c55e,#15803d);
}

.btn-lock{
  background:linear-gradient(135deg,#ef4444,#991b1b);
}

.btn-unlock{
  background:linear-gradient(135deg,#64748b,#334155);
}

.btn-theme{
  background:linear-gradient(135deg,#3b82f6,#1d4ed8);
}

/* =========================
   STATUS
========================= */

.status-bar{
  background:var(--card);

  border:1px solid var(--border);

  border-radius:18px;

  padding:15px 18px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:20px;

  box-shadow:
  0 10px 25px rgba(0,0,0,.18);
}

/* =========================
   PARTIDOS OPTIMIZADOS
========================= */

.matches{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.match{
  position:relative;
  overflow:hidden;

  background:
  linear-gradient(
    180deg,
    rgba(36,36,36,.96),
    rgba(24,24,24,.98)
  );

  border:1px solid rgba(255,255,255,.06);

  border-radius:22px;

  padding:12px;

  min-width:0;

  transition:
  transform .22s ease,
  border-color .22s ease;

  box-shadow:
  0 10px 24px rgba(0,0,0,.2);
}

body.light .match{
  background:
  linear-gradient(
    180deg,
    #ffffff,
    #f7f7f9
  );
}

.match:hover{
  transform:translateY(-2px);

  border-color:
  rgba(245,197,24,.25);
}

.match::before{
  content:'';

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:4px;

  background:var(--gold);

  opacity:.12;
}

.match.filled::before{
  opacity:1;

  box-shadow:
  0 0 18px var(--gold);
}

.match-top{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);

  gap:8px;

  align-items:center;
}

.team{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  min-width:0;
}

.team span{
  width:100%;

  text-align:center;

  font-size:.72rem;
  font-weight:800;
  line-height:1.08;

  overflow:hidden;
  text-overflow:ellipsis;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;

  min-height:30px;
}

.flag{
  width:34px;
  height:22px;

  object-fit:cover;

  border-radius:5px;

  margin-bottom:5px;

  border:1px solid rgba(255,255,255,.14);

  box-shadow:
  0 2px 6px rgba(0,0,0,.3);
}

.score-wrap{
  display:flex;
  align-items:center;
  gap:4px;
}

.score{
  width:38px;
  height:42px;

  border-radius:12px;

  border:2px solid var(--border);

  background:var(--mid);

  color:var(--gold);

  font-family:'Bebas Neue';
  font-size:1.35rem;

  text-align:center;

  outline:none;

  transition:.2s ease;
}

.score:focus{
  border-color:var(--gold);

  box-shadow:
  0 0 12px rgba(245,197,24,.25);
}

.match-info{
  margin-top:10px;

  text-align:center;

  font-size:.58rem;
  line-height:1.3;

  color:var(--muted);
}

/* =========================
   CAPTURA
========================= */

#captureArea{
  background:transparent;
  padding:10px;
}

.capture-watermark{
  margin-top:25px;

  text-align:center;

  font-size:.7rem;

  opacity:.55;

  letter-spacing:3px;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.9);

  z-index:5000;

  display:none;
  align-items:center;
  justify-content:center;

  backdrop-filter:blur(8px);
}

.modal-card{
  width:90%;
  max-width:320px;

  border-radius:26px;

  padding:30px;

  background:var(--card);

  border:1px solid var(--border);
}

/* =========================
   GOAL OVERLAY
========================= */

#goalOverlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.95);

  z-index:9999;

  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  backdrop-filter:blur(10px);
}

.goal-title{
  font-family:'Bebas Neue';

  font-size:min(16vw,8rem);

  color:var(--gold);

  text-shadow:
  0 0 25px var(--gold),
  0 0 80px var(--gold);

  animation:goalPulse .3s infinite alternate;
}

@keyframes goalPulse{
  from{transform:scale(1);}
  to{transform:scale(1.08);}
}

/* =========================
   FLASH
========================= */

#flash-container{
  position:fixed;
  inset:0;

  pointer-events:none;

  z-index:10000;

  display:none;
}

.camera-burst{
  position:absolute;

  width:180px;
  height:180px;

  border-radius:50%;

  background:#fff;

  filter:blur(50px);

  opacity:0;

  animation:burst .25s ease-out forwards;
}

@keyframes burst{
  0%{
    opacity:0;
    transform:scale(.2);
  }
  50%{
    opacity:1;
    transform:scale(1.5);
  }
  100%{
    opacity:0;
    transform:scale(2);
  }
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;

  bottom:20px;
  left:50%;

  transform:translateX(-50%);

  background:var(--green);

  color:#fff;

  padding:12px 20px;

  border-radius:999px;

  display:none;

  z-index:7000;

  font-weight:700;
}

/* =========================
   MOBILE
========================= */

@media(max-width:820px){

  .matches{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .match{
    padding:10px;
  }

  .team span{
    font-size:.64rem;
    min-height:28px;
  }

  .flag{
    width:30px;
    height:19px;
  }

  .score{
    width:34px;
    height:38px;
    font-size:1.15rem;
  }

  .match-info{
    font-size:.52rem;
  }
}

@media(max-width:560px){

  .matches{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .action-btn{
    min-width:120px;
    height:52px;
    font-size:.78rem;
  }

  .fifa-banner{
    padding:24px;
  }

  .team span{
    font-size:.6rem;
  }
}

</style>
</head>

  {h:"Suecia",a:"Túnez",d:"14 Jun · 20:00",s:"Estadio BBVA"},
  {h:"España",a:"Cabo Verde",d:"15 Jun · 10:00",s:"Mercedes-Benz Stadium"},
  {h:"Bélgica",a:"Egipto",d:"15 Jun · 13:00",s:"Lumen Field"},
  {h:"Arabia Saudita",a:"Uruguay",d:"15 Jun · 16:00",s:"Hard Rock Stadium"},
  {h:"Irán",a:"Nueva Zelanda",d:"15 Jun · 19:00",s:"SoFi Stadium"},
  {h:"Francia",a:"Senegal",d:"16 Jun · 13:00",s:"MetLife Stadium"},
  {h:"Argentina",a:"Argelia",d:"16 Jun · 16:00",s:"Arrowhead Stadium"},
  {h:"Irak",a:"Noruega",d:"16 Jun · 19:00",s:"Gillette Stadium"},
  {h:"Austria",a:"Jordania",d:"16 Jun · 19:00",s:"Bay Area Stadium"},
  {h:"Portugal",a:"RD Congo",d:"17 Jun · 11:00",s:"NRG Stadium"},
  {h:"Ghana",a:"Panamá",d:"17 Jun · 13:00",s:"Toronto Stadium"},
  {h:"Inglaterra",a:"Croacia",d:"17 Jun · 14:00",s:"AT&T Stadium"},
  {h:"Uzbekistán",a:"Colombia",d:"17 Jun · 19:00",s:"Estadio Azteca"}
];

let currentUser = "";
let currentCode = "";
let locked = false;
let picks = {};
let mCallback = null;

/* =========================
   THEME
========================= */

if(localStorage.getItem("wc_theme")==="light"){
  document.body.classList.add("light");
}

function toggleTheme(){

  playClick();

  document.body.classList.toggle("light");

  const isLight =
  document.body.classList.contains("light");

  localStorage.setItem(
    "wc_theme",
    isLight ? "light":"dark"
  );

  document.getElementById("themeMeta")
  .setAttribute(
    "content",
    isLight ? "#ffffff":"#121212"
  );

  toast(
    isLight
    ? "☀️ MODO CLARO"
    : "🌙 MODO OSCURO"
  );
}

/* =========================
   LOGIN
========================= */

document.getElementById("codeInput")
.addEventListener("input",function(){

  let n = USER_CODES[this.value.toUpperCase()];

  document.getElementById("loginPreview")
  .textContent = n ? "HOLA, " + n + "!" : "";
});

function doLogin(){

  let c =
  document.getElementById("codeInput")
  .value.toUpperCase();

  if(USER_CODES[c]){

    document.getElementById("fifaSound")
    .play()
    .catch(()=>{});

    document.getElementById("crowdSound")
    .play()
    .catch(()=>{});

    currentUser = USER_CODES[c];
    currentCode = c;

    loadData();

    showApp();

  }else{
    alert("CÓDIGO INVÁLIDO");
  }
}

/* =========================
   DATA
========================= */

function loadData(){

  picks = JSON.parse(
    localStorage.getItem(
      "wc26_picks_" + currentCode
    ) || "{}"
  );

  locked =
  localStorage.getItem(
    "wc26_lock_" + currentCode
  ) === "1";
}

/* =========================
   SHOW APP
========================= */

function showApp(){

  document.getElementById("loginScreen")
  .style.display = "none";

  document.getElementById("app")
  .style.display = "block";

  document.getElementById("displayUser")
  .textContent = currentUser;

  renderMatches();

  updateStatusUI();
}

/* =========================
   RENDER MATCHES
========================= */

function renderMatches(){

  const mc =
  document.getElementById("matchesContainer");

  mc.innerHTML = MATCHES.map((m,idx)=>{

    const hV =
    picks[`j1_${idx}_h`] || "";

    const aV =
    picks[`j1_${idx}_a`] || "";

    return `

    <div class="match ${hV!=='' && aV!=='' ? 'filled':''}">

      <div class="match-top">

        <div class="team">

          <img class="flag"
          src="https://flagcdn.com/w80/${FLAGS[m.h] || 'un'}.png">

          <span>${m.h}</span>

        </div>

        <div class="score-wrap">

          <input
          class="score"
          type="number"
          value="${hV}"
          ${locked?'disabled':''}
          oninput="updatePick(${idx},'h',this)">

          <span style="font-family:'Bebas Neue';color:var(--gold);">:</span>

          <input
          class="score"
          type="number"
          value="${aV}"
          ${locked?'disabled':''}
          oninput="updatePick(${idx},'a',this)">

        </div>

        <div class="team">

          <img class="flag"
          src="https://flagcdn.com/w80/${FLAGS[m.a] || 'un'}.png">

          <span>${m.a}</span>

        </div>

      </div>

      <div class="match-info">
        ${m.d} • ${m.s}
      </div>

    </div>

    `;

  }).join("");
}

/* =========================
   PICKS
========================= */

function updatePick(idx,side,el){

  picks[`j1_${idx}_${side}`] =
  el.value.slice(0,2);

  el.closest(".match")
  .classList.toggle(
    "filled",
    picks[`j1_${idx}_h`] &&
    picks[`j1_${idx}_a`]
  );
}

/* =========================
   STATUS
========================= */

function updateStatusUI(){

  const st =
  document.getElementById("statusText");

  st.innerHTML = locked
  ? "ESTADO: CERRADO 🔒"
  : "ESTADO: ABIERTO 🟢";

  st.style.color = locked
  ? "var(--red)"
  : "var(--green)";
}

/* =========================
   SAVE
========================= */

function savePicks(){

  playClick();

  if(locked){
    return toast("🔒 PRONÓSTICOS CERRADOS");
  }

  localStorage.setItem(
    "wc26_picks_" + currentCode,
    JSON.stringify(picks)
  );

  toast("💾 GUARDADO");
}

/* =========================
   LOCK
========================= */

function handleLock(){

  playClick();

  if(locked) return;

  if(confirm("¿BLOQUEAR PRONÓSTICOS?")){

    locked = true;

    localStorage.setItem(
      "wc26_lock_" + currentCode,
      "1"
    );

    savePicks();

    renderMatches();

    updateStatusUI();
  }
}

/* =========================
   MODAL
========================= */

function openM(title,desc,cb){

  document.getElementById("mTitle")
  .textContent = title;

  document.getElementById("mDesc")
  .textContent = desc;

  document.getElementById("mInput")
  .value = "";

  document.getElementById("masterModal")
  .style.display = "flex";

  mCallback = cb;
}

function closeM(){

  document.getElementById("masterModal")
  .style.display = "none";
}

function confirmM(){

  if(
    document.getElementById("mInput").value
    === ADMIN_PASS
  ){

    closeM();

    if(mCallback) mCallback();

  }else{
    alert("CLAVE INCORRECTA");
  }
}

/* =========================
   UNLOCK
========================= */

function handleUnlock(){

  playClick();

  openM(
    "DESBLOQUEAR",
    "Ingresa clave administrativa",
    function(){

      locked = false;

      localStorage.setItem(
        "wc26_lock_" + currentCode,
        "0"
      );

      renderMatches();

      updateStatusUI();
    }
  );
}

/* =========================
   EXPORT
========================= */

function handleExport(){

  playClick();

  if(!locked){

    openM(
      "EXPORTAR",
      "PRONÓSTICOS ABIERTOS. CLAVE REQUERIDA.",
      doExport
    );

  }else{
    doExport();
  }
}

function doExport(){

  const overlay =
  document.getElementById("goalOverlay");

  const flash =
  document.getElementById("flash-container");

  flash.style.display = "block";

  for(let i=0;i<35;i++){

    setTimeout(()=>{

      const b =
      document.createElement("div");

      b.className = "camera-burst";

      b.style.top =
      Math.random()*100 + "%";

      b.style.left =
      Math.random()*100 + "%";

      flash.appendChild(b);

      setTimeout(()=>b.remove(),300);

    },i*40);
  }

  overlay.style.display = "flex";

  setTimeout(()=>{

    const area =
    document.getElementById("captureArea");

    const header =
    document.getElementById("captureHeader");

    header.style.display = "block";

    document.getElementById("capStatus")
    .textContent =
    locked
    ? "PRONÓSTICO CERRADO"
    : "PRONÓSTICO ABIERTO";

    document.getElementById("capUser")
    .textContent = currentUser;

    const inputs =
    area.querySelectorAll("input");

    const backups = [];

    inputs.forEach(inp=>{

      const rep =
      document.createElement("div");

      rep.className = inp.className;

      rep.style.display = "flex";
      rep.style.alignItems = "center";
      rep.style.justifyContent = "center";

      rep.textContent =
      inp.value || "-";

      backups.push({
        orig:inp,
        rep:rep
      });

      inp.style.display = "none";

      inp.parentNode.insertBefore(rep,inp);
    });

    html2canvas(area,{
      scale:3,
      useCORS:true,
      backgroundColor:null
    }).then(canvas=>{

      backups.forEach(b=>{

        b.rep.remove();

        b.orig.style.display =
        "inline-block";
      });

      overlay.style.display = "none";

      flash.style.display = "none";

      header.style.display = "none";

      const link =
      document.createElement("a");

      link.download =
      `WC26_${currentUser}.png`;

      link.href =
      canvas.toDataURL("image/png",1);

      link.click();

      renderMatches();

    });

  },1400);
}

/* =========================
   AUDIO
========================= */

function playClick(){

  const a =
  document.getElementById("clickSound");

  a.currentTime = 0;

  a.play().catch(()=>{});
}

/* =========================
   TOAST
========================= */

function toast(m){

  const t =
  document.getElementById("toast");

  t.textContent = m;

  t.style.display = "block";

  setTimeout(()=>{
    t.style.display = "none";
  },2500);
}

</script>

</body>
</html>
