<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<title>Mundial 2026 - Estadio Virtual</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
:root {
  --gold: #f5c518;
  --gold2: #c9900a;
  --red: #c0392b;
  --green: #27ae60;
  --bg: #121212;      /* Gris Carbón solicitado */
  --mid: #1a1a1a;
  --card: #1e1e1e;
  --border: #333333;
  --text: #e8eaf0;
  --muted: #888888;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Exo 2', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* ── LUCES DE ESTADIO (ANIMACIÓN DE FONDO) ── */
.stadium-lights {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: 
    radial-gradient(circle at 20% 20%, rgba(255,255,255,0.02) 0%, transparent 40%),
    radial-gradient(circle at 80% 20%, rgba(255,255,255,0.02) 0%, transparent 40%);
  z-index: 1; pointer-events: none; animation: lightMove 10s infinite alternate ease-in-out;
}
@keyframes lightMove { 0% { opacity: 0.3; } 100% { opacity: 0.8; } }

/* ── FLASH DE CÁMARA ── */
#cameraFlash {
  position: fixed; inset: 0; background: #fff; z-index: 10000;
  opacity: 0; pointer-events: none;
}
.flash-active { animation: flashAnim 0.3s ease-out; }
@keyframes flashAnim { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

/* ── LOGIN ── */
.login-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; position: relative; z-index: 10; }
.login-card { 
  width: 100%; max-width: 360px; background: rgba(30, 30, 30, 0.95); border: 2px solid var(--border); 
  border-radius: 28px; padding: 40px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.8);
  animation: entrance 0.8s ease-out;
}
@keyframes entrance { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

.login-input { 
  width: 100%; height: 60px; background: var(--mid); border: 2px solid var(--border); border-radius: 15px; 
  color: #fff; font-size: 1.4rem; text-align: center; letter-spacing: 5px; margin-bottom: 20px; outline: none;
}
.login-btn { 
  width: 100%; height: 60px; background: linear-gradient(135deg, var(--gold), var(--gold2)); border: none; 
  border-radius: 15px; color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; cursor: pointer;
}

/* ── BANNER FIFA ── */
.fifa-banner {
  background: linear-gradient(135deg, #000 0%, #222 100%);
  border: 1px solid var(--border); border-radius: 24px; padding: 40px;
  text-align: center; position: relative; overflow: hidden; margin-bottom: 25px;
}
.fifa-banner::after {
  content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
  transform: skewX(-20deg); animation: sweep 6s infinite;
}
@keyframes sweep { 0% { left: -100%; } 30% { left: 150%; } 100% { left: 150%; } }
.fifa-title { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; color: #fff; letter-spacing: 3px; line-height: 1; }

/* ── TARJETAS ORIGINALES CON DETALLE DORADO ── */
.matches { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media(min-width: 768px) { .matches { grid-template-columns: 1fr 1fr; } }
.match { 
  background: var(--card); border: 1px solid var(--border); border-radius: 20px; 
  padding: 20px; position: relative; overflow: hidden; transition: 0.3s;
}
/* Detalle Dorado Lateral */
.match::before { 
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; 
  background: var(--gold); opacity: 0.15; transition: 0.3s;
}
.match.filled::before { opacity: 1; box-shadow: 0 0 15px var(--gold); }

.match-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.team { display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 700; font-size: 0.85rem; }
.flag { width: 38px; height: 25px; border-radius: 4px; object-fit: cover; border: 1px solid #333; }

/* Score Fix: Evita desplazamientos en captura */
.score { 
  width: 52px; height: 52px; line-height: 52px; background: var(--mid); 
  border: 2px solid var(--border); border-radius: 12px; color: var(--gold); 
  font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; text-align: center; 
  outline: none; padding: 0; display: inline-block; vertical-align: middle;
}

/* ── MODALES CUSTOM ── */
.modal-overlay { 
  position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000;
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-card { 
  background: var(--card); border: 1px solid var(--border); border-radius: 28px; 
  padding: 35px; width: 100%; max-width: 320px; text-align: center;
}
.modal-card h3 { font-family: 'Bebas Neue', sans-serif; color: var(--gold); font-size: 1.8rem; margin-bottom: 15px; }

/* ── GOL OVERLAY ── */
#goalOverlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999;
  display: none; align-items: center; justify-content: center; flex-direction: column;
}
.goal-text { 
  font-family: 'Bebas Neue', sans-serif; font-size: 15vw; color: var(--gold); 
  text-shadow: 0 0 60px var(--gold); animation: goalPop 0.4s infinite alternate;
}
@keyframes goalPop { from { transform: scale(1); } to { transform: scale(1.1); } }

/* ── UI BOTONES ── */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
.action-btn { height: 52px; border: none; border-radius: 12px; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
.action-btn:active { transform: scale(0.95); }

#toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; padding: 12px 24px; border-radius: 100px; font-weight: 700; opacity: 0; transition: 0.4s; z-index: 3000; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
</style>
</head>
<body>

<div class="stadium-lights"></div>
<div id="cameraFlash"></div>

<audio id="fifaSound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" type="audio/mpeg">
</audio>

<div id="goalOverlay">
    <div class="goal-text">¡GOOOOOOOOL!</div>
    <p style="font-family: 'Bebas Neue'; color: #fff; font-size: 1.5rem; letter-spacing: 4px;">CAPTURANDO JUGADA...</p>
</div>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
    <h1 style="font-family: 'Bebas Neue'; color: var(--gold); font-size: 2.5rem; letter-spacing: 2px;">MUNDIAL 2026</h1>
    <p style="color: var(--muted); font-size: 0.8rem; margin-bottom: 25px;">PREDICTOR OFICIAL FIFA</p>
    <input type="text" id="codeInput" class="login-input" maxlength="6" placeholder="CÓDIGO">
    <div id="loginPreview" style="color: var(--gold); font-weight: 700; margin-bottom: 15px; height: 20px;"></div>
    <button class="login-btn" onclick="doLogin()">INGRESAR AL ESTADIO</button>
    <div id="loginErr" style="color: var(--red); margin-top: 12px; font-size: 0.8rem;"></div>
  </div>
</div>

<div class="app" id="app" style="display:none;">
  <div class="main" style="max-width: 1200px; margin: auto; padding: 16px; position: relative; z-index: 10;">
    
    <div class="fifa-banner">
      <div class="fifa-title">MUNDIAL 2026</div>
      <p style="color: var(--gold); font-family: 'Bebas Neue'; letter-spacing: 4px;">JORNADA 1 • GRUPOS</p>
    </div>

    <div class="actions">
      <button class="action-btn" style="background:var(--gold); color:#000" onclick="savePicks()">💾 GUARDAR</button>
      <button class="action-btn" style="background:var(--green)" onclick="handleExport()">📸 EXPORTAR</button>
      <button class="action-btn" style="background:var(--red)" onclick="handleLock()">🔒 BLOQUEAR</button>
      <button class="action-btn" style="background:#4b5563" onclick="handleUnlock()">🔓 DESBLOQUEAR</button>
    </div>

    <div style="background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 18px; margin-bottom: 20px; display: flex; justify-content: space-between; font-size: 0.85rem;">
      <div id="statusText">ESTADO: ABIERTO 🟢</div>
      <div id="displayUser" style="font-weight: 700; color: var(--gold); text-transform: uppercase;"></div>
    </div>

    <div id="captureArea" style="padding: 15px; background: var(--bg);">
       <div id="captureHeader" style="display:none; margin-bottom: 25px; border-bottom: 2px solid var(--border); padding-bottom: 20px;">
           <div style="display: flex; justify-content: space-between; align-items: center;">
             <div>
               <div style="font-family:'Bebas Neue'; color: var(--gold); font-size: 2.8rem; line-height: 1;">FIFA WORLD CUP 2026</div>
               <div id="capStatus" style="font-family: 'Bebas Neue'; color:#fff; font-size: 1.2rem;">-</div>
             </div>
             <div style="text-align: right;">
               <div id="capUser" style="color:#fff; font-weight: 800; font-size: 1.5rem; font-family: 'Bebas Neue';"></div>
             </div>
           </div>
       </div>
       <div class="matches" id="matchesContainer"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="customModal">
  <div class="modal-card">
    <h3 id="modalTitle">ADMIN ACCESO</h3>
    <p id="modalDesc" style="font-size: 0.8rem; color: var(--muted); margin-bottom: 15px;">Introduce la clave maestra</p>
    <input type="password" id="modalInput" class="login-input" placeholder="••••" style="letter-spacing: 10px;">
    <div style="display: flex; gap: 10px;">
      <button class="action-btn" style="background:#4b5563; flex:1" onclick="closeModal()">CANCELAR</button>
      <button class="action-btn" style="background:var(--gold); color:#000; flex:1" onclick="confirmModal()">OK</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// Base de datos actualizada
const ADMIN_PASS = "AP420";
const USER_CODES = { 
    "JDQM26": "Juan de Dios", 
    "AEQM26": "Andrés Esparza",
    "FEQM26": "Fernando Esparza", // Nuevo usuario
    "ADMIN0": "Administrador" 
};

const FLAGS = {
  "México": "mx", "Sudáfrica": "za", "Corea del Sur": "kr", "Rep. Checa": "cz",
  "Canadá": "ca", "Bosnia y Herz.": "ba", "Estados Unidos": "us", "Paraguay": "py",
  "Qatar": "qa", "Suiza": "ch", "Brasil": "br", "Marruecos": "ma",
  "Haití": "ht", "Escocia": "gb-sct", "Australia": "au", "Turquía": "tr",
  "Alemania": "de", "Curazao": "cw", "Países Bajos": "nl", "Japón": "jp",
  "Costa de Marfil": "ci", "Ecuador": "ec", "Suecia": "se", "Túnez": "tn",
  "España": "es", "Cabo Verde": "cv", "Bélgica": "be", "Egipto": "eg",
  "Arabia Saudita": "sa", "Uruguay": "uy", "Irán": "ir", "Nueva Zelanda": "nz",
  "Francia": "fr", "Senegal": "sn", "Argentina": "ar", "Argelia": "dz",
  "Irak": "iq", "Noruega": "no", "Austria": "at", "Jordania": "jo",
  "Portugal": "pt", "RD Congo": "cd", "Ghana": "gh", "Panamá": "pa",
  "Inglaterra": "gb-eng", "Croacia": "hr", "Uzbekistán": "uz", "Colombia": "co"
};

const MATCHES = [
  {h:"México",a:"Sudáfrica",d:"11 Jun · 13:00",s:"Estadio Azteca"},
  {h:"Corea del Sur",a:"Rep. Checa",d:"11 Jun · 20:00",s:"Estadio Akron"},
  {h:"Canadá",a:"Bosnia y Herz.",d:"12 Jun · 13:00",s:"Toronto Stadium"},
  {h:"Estados Unidos",a:"Paraguay",d:"12 Jun · 19:00",s:"SoFi Stadium"},
  {h:"Qatar",a:"Suiza",d:"13 Jun · 13:00",s:"Bay Area Stadium"},
  {h:"Brasil",a:"Marruecos",d:"13 Jun · 16:00",s:"MetLife Stadium"},
  {h:"Haití",a:"Escocia",d:"13 Jun · 19:00",s:"Gillette Stadium"},
  {h:"Australia",a:"Turquía",d:"13 Jun · 22:00",s:"BC Place"},
  {h:"Alemania",a:"Curazao",d:"14 Jun · 11:00",s:"NRG Stadium"},
  {h:"Países Bajos",a:"Japón",d:"14 Jun · 14:00",s:"AT&T Stadium"},
  {h:"Costa de Marfil",a:"Ecuador",d:"14 Jun · 17:00",s:"Lincoln Financial"},
  {h:"Suecia",a:"Túnez",d:"14 Jun · 20:00",s:"Estadio BBVA"},
  {h:"España",a:"Cabo Verde",d:"15 Jun · 10:00",s:"Mercedes-Benz Stadium"},
  {h:"Bélgica",a:"Egipto",d:"15 Jun · 13:00",s:"Lumen Field"},
  {h:"Arabia Saudita",a:"Uruguay",d:"15 Jun · 16:00",s:"Hard Rock Stadium"},
  {h:"Irán",a:"Nueva Zelanda",d:"15 Jun · 19:00",s:"SoFi Stadium"},
  {h:"Francia",a:"Senegal",d:"16 Jun · 13:00",s:"MetLife Stadium"},
  {h:"Argentina",a:"Argelia",d:"16 Jun · 16:00",s:"Arrowhead Stadium"},
  {h:"Irak",a:"Noruega",d:"16 Jun · 19:00",s:"Gillette Stadium"},
  {h:"Austria",a:"Jordania",d:"16 Jun · 19:00",s:"Bay Area Stadium"},
  {h:"Portugal",a:"RD Congo",d:"17 Jun · 11:00",s:"NRG Stadium"},
  {h:"Ghana",a:"Panamá",d:"17 Jun · 13:00",s:"Toronto Stadium"},
  {h:"Inglaterra",a:"Croacia",d:"17 Jun · 14:00",s:"AT&T Stadium"},
  {h:"Uzbekistán",a:"Colombia",d:"17 Jun · 19:00",s:"Estadio Azteca"}
];

let currentUser = "", currentCode = "", locked = false, picks = {}, modalCallback = null;

// Login logic
document.getElementById('codeInput').addEventListener('input', function() {
    let n = USER_CODES[this.value.toUpperCase()];
    document.getElementById('loginPreview').textContent = n ? "HOLA, " + n + "!" : "";
});

function doLogin(){
  let c = document.getElementById("codeInput").value.toUpperCase();
  if(USER_CODES[c]){
    document.getElementById('fifaSound').play().catch(e => {});
    currentUser = USER_CODES[c]; currentCode = c;
    loadData(); showApp();
  } else { document.getElementById("loginErr").textContent = "CÓDIGO INVÁLIDO"; }
}

function loadData(){
  picks = JSON.parse(localStorage.getItem("wc26_picks_" + currentCode) || "{}");
  locked = localStorage.getItem("wc26_lock_" + currentCode) === "1";
}

function showApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("displayUser").textContent = currentUser;
  renderMatches();
  updateStatusUI();
}

function renderMatches(){
  const mc = document.getElementById("matchesContainer");
  mc.innerHTML = MATCHES.map((m, idx) => {
    const hV = picks[`j1_${idx}_h`] || ""; const aV = picks[`j1_${idx}_a`] || "";
    return `
      <div class="match ${hV !== '' && aV !== '' ? 'filled' : ''}">
        <div class="match-top">
          <div class="team">
            <img class="flag" src="https://flagcdn.com/w80/${FLAGS[m.h] || "un"}.png">
            <span>${m.h}</span>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <input class="score" type="number" value="${hV}" ${locked?'disabled':''} oninput="updatePick(${idx},'h',this)">
            <span style="color:var(--gold); font-family:'Bebas Neue'">:</span>
            <input class="score" type="number" value="${aV}" ${locked?'disabled':''} oninput="updatePick(${idx},'a',this)">
          </div>
          <div class="team">
            <img class="flag" src="https://flagcdn.com/w80/${FLAGS[m.a] || "un"}.png">
            <span>${m.a}</span>
          </div>
        </div>
        <div style="margin-top:10px; font-size:0.6rem; color:var(--muted); text-align:center;">${m.d} | ${m.s}</div>
      </div>
    `;
  }).join('');
}

function updatePick(idx, side, el){
  picks[`j1_${idx}_${side}`] = el.value.slice(0,2);
  el.closest(".match").classList.toggle("filled", (picks[`j1_${idx}_h`] && picks[`j1_${idx}_a`]));
}

function updateStatusUI(){
  document.getElementById("statusText").innerHTML = locked ? "ESTADO: CERRADO 🔒" : "ESTADO: ABIERTO 🟢";
  document.getElementById("statusText").style.color = locked ? "var(--red)" : "var(--green)";
}

function savePicks(){
  if(locked) return showToast("🔒 PRONÓSTICOS CERRADOS");
  localStorage.setItem("wc26_picks_" + currentCode, JSON.stringify(picks));
  showToast("💾 GUARDADO");
}

function handleLock(){
  if(locked) return;
  if(confirm("¿BLOQUEAR PRONÓSTICOS?")) {
    locked = true; localStorage.setItem("wc26_lock_" + currentCode, "1");
    savePicks(); renderMatches(); updateStatusUI();
  }
}

// ─── Lógica de Modal Personalizado ───
function openModal(title, desc, cb) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalDesc").textContent = desc;
    document.getElementById("modalInput").value = "";
    document.getElementById("customModal").classList.add("show");
    modalCallback = cb;
}
function closeModal() { document.getElementById("customModal").classList.remove("show"); }
function confirmModal() {
    if(document.getElementById("modalInput").value === ADMIN_PASS) {
        closeModal();
        if(modalCallback) modalCallback();
    } else { alert("CLAVE INCORRECTA"); }
}

function handleUnlock(){
    openModal("DESBLOQUEAR", "Ingresa la clave maestra para editar", function() {
        locked = false; localStorage.setItem("wc26_lock_" + currentCode, "0");
        renderMatches(); updateStatusUI();
    });
}

function handleExport(){
  if(!locked){
    openModal("EXPORTAR", "Pronósticos ABIERTOS. Se requiere clave para generar imagen.", doExport);
  } else {
    doExport();
  }
}

function doExport(){
  // FLASH DE CÁMARA
  const flash = document.getElementById("cameraFlash");
  flash.classList.add("flash-active");
  setTimeout(() => flash.classList.remove("flash-active"), 300);

  setTimeout(() => {
    const overlay = document.getElementById("goalOverlay");
    overlay.style.display = "flex";
    
    setTimeout(() => {
        const area = document.getElementById("captureArea");
        const header = document.getElementById("captureHeader");
        header.style.display = "block";
        document.getElementById("capStatus").textContent = locked ? "PRONÓSTICO CERRADO" : "PRONÓSTICO ABIERTO";
        document.getElementById("capUser").textContent = "PARTICIPANTE: " + currentUser;

        // Limpieza de inputs para captura limpia (evitar desplazamientos)
        const inputs = area.querySelectorAll("input");
        const backups = [];
        inputs.forEach(inp => {
          const rep = document.createElement("div");
          rep.className = inp.className;
          rep.style.height = "52px"; rep.style.lineHeight = "52px";
          rep.style.display = "inline-block"; rep.style.textAlign = "center";
          rep.textContent = inp.value || "-";
          backups.push({orig: inp, rep: rep});
          inp.style.display = "none";
          inp.parentNode.insertBefore(rep, inp);
        });

        html2canvas(area, { scale: 2, backgroundColor: "#121212", useCORS: true }).then(canvas => {
            backups.forEach(b => { b.rep.remove(); b.orig.style.display = "inline-block"; });
            header.style.display = "none";
            overlay.style.display = "none";
            const link = document.createElement("a");
            link.download = `WC26_${currentUser}.jpg`;
            link.href = canvas.toDataURL("image/jpeg", 0.9);
            link.click();
        });
    }, 1200);
  }, 300);
}

function showToast(m){
  const t = document.getElementById("toast"); t.textContent = m;
  t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 2500);
}
</script>
</body>
</html>
